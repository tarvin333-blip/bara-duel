<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#0b0a09;display:flex;gap:40px;justify-content:center;align-items:flex-end;height:100vh;font-family:serif}
.card{position:relative;width:220px;height:320px;margin-top:90px}
.card .bg{position:absolute;inset:0;background:url(../art/bg/forge.png) center/cover;filter:brightness(.55) saturate(.8);border-radius:6px}
.card .frame{position:absolute;inset:0;border:6px solid #8a6a3a;border-radius:6px;box-shadow:inset 0 0 0 2px #2a1d10,inset 0 0 30px #000,0 8px 30px #000;outline:2px solid #1a120a;outline-offset:-12px}
.card .ch{position:absolute;left:50%;bottom:58px;height:118%;transform:translateX(-50%)}
.card .clip{position:absolute;left:0;right:0;bottom:0;height:62px;background:linear-gradient(#1a1410,#0d0a08);border-top:2px solid #8a6a3a;border-radius:0 0 6px 6px}
.card .nm{position:absolute;left:0;right:0;bottom:30px;text-align:center;color:#ece2c8;font-size:18px;letter-spacing:1px}
.card .cl{position:absolute;left:0;right:0;bottom:12px;text-align:center;color:#a8987a;font-size:11px}
.card .gem{position:absolute;top:-10px;left:-10px;width:34px;height:34px;border-radius:50%;background:radial-gradient(#e85a2a,#5a1406);border:3px solid #8a6a3a;color:#fff;font:bold 15px sans-serif;display:grid;place-items:center;z-index:3}
.flat .ch{height:76%;bottom:64px}
.flat{overflow:hidden}
.lbl{color:#8b857a;font:12px sans-serif;text-align:center;margin-top:8px}
</style></head><body>
<div><div class="card flat"><div class="bg"></div><img class="ch" src="../art/paint/dorin_cut1.png"><div class="clip"></div><div class="frame"></div><div class="nm">ดอริน</div><div class="cl">ช่างตีเหล็ก · แทงก์</div></div><div class="lbl">การ์ดธรรมดา</div></div>
<div><div class="card"><div class="bg"></div><div class="frame"></div><img class="ch" src="../art/paint/dorin_cut1.png"><div class="clip"></div><div class="nm">ดอริน</div><div class="cl">ช่างตีเหล็ก · แทงก์</div><div class="gem">3</div></div><div class="lbl">โอเวอร์เฟรม</div></div>
</body></html>
