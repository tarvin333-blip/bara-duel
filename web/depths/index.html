<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0709">
<title>Bara Depths</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chonburi&family=Trirong:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060508; --panel:#110d0b; --panel2:#1b1410; --line:#4a3a2a; --ink:#e6d9bf; --dim:#a39176; --mute:#6a5a48;
  --red:#a3242c; --gold:#c9a45c; --fade:#8f6bd8; --heal:#6fc28a; --blue:#5aa9ff; --rust:#5c4630;
  --hd:Chonburi,'Trirong',serif; --bd:Trirong,'Sarabun',serif;
  --W:min(100vw,480px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--bd);overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit}
img.px,.px{image-rendering:pixelated}
#app{position:relative;width:var(--W);height:100%;margin:0 auto;overflow:hidden;background:#000}
.scr{position:absolute;inset:0;display:none;flex-direction:column}
.scr.on{display:flex}
h1,h2,h3{font-family:var(--hd);margin:0;font-weight:400;letter-spacing:.3px}
.btn{background:linear-gradient(#2a211b,#120d0a);border:1px solid var(--rust);border-radius:2px;padding:10px 14px;font-size:15px;font-weight:600;min-height:44px;cursor:pointer;color:#e2cfa6;
  box-shadow:inset 0 0 0 1px #000,inset 0 1px 0 #ffffff12,0 2px 0 #000;text-shadow:0 1px 0 #000}
.btn:active{transform:translateY(1px);filter:brightness(1.2)}
.btn.red{background:linear-gradient(#5e1418,#2c080a);border-color:#8c2a2a;color:#f0d9b0}
.btn.gold{background:linear-gradient(#5a4320,#2a1e0c);border-color:#a8863f;color:#f6e3b4}
.btn[disabled]{opacity:.38;pointer-events:none}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;image-rendering:pixelated}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 30%,#000c 95%)}
.topbar{position:relative;z-index:3;display:flex;gap:10px;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:linear-gradient(#000e,#0000);font-size:14px}
.topbar .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:4px;background:#000b;border:1px solid var(--rust);border-radius:2px;padding:3px 9px;font-weight:700;font-size:13px}
.gold-t{color:var(--gold)} .fade-t{color:var(--fade)} .red-t{color:var(--red)} .heal-t{color:var(--heal)} .dim{color:var(--dim)}
.sheet{position:relative;z-index:3;background:linear-gradient(#17110d,#0b0807);border-top:3px double var(--rust);box-shadow:0 -6px 18px #000;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}

/* ---------- title ---------- */
#title .bg{background-image:url(../art/bg/prison.png);filter:brightness(.55) saturate(1.2)}
#title .inner{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:24px 24px calc(48px + env(safe-area-inset-bottom));gap:12px;text-align:center}
#title h1{font-size:46px;line-height:1.05;color:#e9d3a6;text-shadow:0 3px 0 #2a0606,0 0 28px #a3242c99}
#title .sub{font-family:var(--hd);font-size:20px;color:var(--red);margin-top:-4px;letter-spacing:2px}
#title .tag{color:var(--dim);font-size:14px;max-width:300px;margin:4px 0 18px}
#title .btn{width:240px}
.torch{position:absolute;width:160px;height:160px;border-radius:50%;background:radial-gradient(#ffb04a55,#0000 70%);animation:flick 2.4s infinite alternate;pointer-events:none}
@keyframes flick{0%{opacity:.7;transform:scale(1)}40%{opacity:1;transform:scale(1.06)}70%{opacity:.8}100%{opacity:.95;transform:scale(.97)}}

/* ---------- town ---------- */
#town .bg{background-image:url(../art/bg/camp.png);filter:brightness(.42)}
#town .main{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;min-height:0}
.bld{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 12px}
.bld button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:linear-gradient(#1a130fe6,#0c0907e6);border:1px solid var(--rust);outline:1px solid #000;outline-offset:-3px;border-radius:2px;padding:10px;min-height:64px}
.bld button b{font-family:var(--hd);font-size:16px}
.bld button span{font-size:12px;color:var(--dim)}
.bld button.go{grid-column:1/-1;background:linear-gradient(90deg,#3d0b0ee6,#1c0607e6);border-color:#8c2a2a;align-items:center;text-align:center}
.bld button.go b{font-size:20px}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.hcard{position:relative;background:linear-gradient(#18120e,#0c0908);border:1px solid var(--rust);border-radius:2px;padding:4px 4px 6px;text-align:center;cursor:pointer;overflow:hidden}
.hcard img{width:100%;aspect-ratio:128/180;object-fit:contain;display:block}
.hcard .nm{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hcard .cl{font-size:11px;color:var(--dim)}
.hcard.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.hcard.off{opacity:.42}
.hcard .badge{position:absolute;top:4px;left:4px;background:var(--gold);color:#000;font-weight:800;border-radius:50%;width:22px;height:22px;font-size:13px;line-height:22px}
.hcard .lv{position:absolute;top:4px;right:4px;font-size:11px;background:#000a;border-radius:4px;padding:0 4px}
.fbar{height:5px;background:#2a1d33;border-radius:3px;overflow:hidden;margin-top:3px}
.fbar i{display:block;height:100%;background:var(--fade)}
.hbar{height:5px;background:#3a1215;border-radius:3px;overflow:hidden;margin-top:3px}
.hbar i{display:block;height:100%;background:var(--red)}
.stag{display:inline-block;font-size:10px;font-weight:800;padding:0 4px;border-radius:3px;margin-top:2px}
.stag.af{background:#4b1f6e;color:#e8d4ff} .stag.vi{background:#7a5a1d;color:#fff2c8} .stag.bz{background:#204058;color:#cfe8ff}

/* ---------- modal ---------- */
#modal{position:absolute;inset:0;z-index:50;background:#000b;display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
#modal .box{width:100%;max-height:88%;background:linear-gradient(#1a130f,#0c0908);border-top:3px double var(--gold);border-radius:0;box-shadow:0 -10px 30px #000;padding:14px 14px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
#modal .box .body{overflow-y:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
#modal .row{display:flex;gap:8px;flex-wrap:wrap}
#modal .row .btn{flex:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px}
.kv b{color:var(--dim);font-weight:600}
.sk{display:flex;gap:8px;align-items:flex-start;background:#0c0807;border:1px solid var(--line);border-radius:2px;padding:6px 8px;font-size:13px}
.sk .ic{font-size:20px;line-height:1}
.pips{font-family:monospace;font-size:12px;letter-spacing:1px}
.pips .pu{color:var(--gold)} .pips .pt{color:var(--red)} .pips .po{color:#4a3a33}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px;background:#0c0807;border:1px solid var(--line);border-radius:2px}
.qty{display:flex;align-items:center;gap:6px}
.qty .btn{min-height:36px;min-width:40px;padding:4px 8px}

/* ---------- explore ---------- */
#explore .bg{transition:background-position .6s}
#map{position:relative;z-index:2;margin:0 12px;background:#050403d9;border:1px solid var(--rust);outline:1px solid #000;outline-offset:-4px}
#map svg{display:block;width:100%;height:auto}
#map .rm{cursor:pointer}
.party{position:relative;z-index:2;flex:1;display:flex;align-items:flex-end;justify-content:center;gap:0;padding:0 8px;min-height:0}
.party .pm{position:relative;width:24%;max-width:110px;display:flex;flex-direction:column;align-items:center}
.party .pm img{width:100%;aspect-ratio:128/180;object-fit:contain}
.party.walk .pm img{animation:bob .45s infinite alternate}
.party .pm:nth-child(2) img{animation-delay:.1s}.party .pm:nth-child(3) img{animation-delay:.2s}.party .pm:nth-child(4) img{animation-delay:.3s}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-4px)}}
.pm .mini{width:90%}
#lightbar{flex:1;height:10px;background:#1b1210;border:1px solid #4a3426;border-radius:6px;overflow:hidden}
#lightbar i{display:block;height:100%;background:linear-gradient(90deg,#7a3b0d,#ffbe55);transition:width .4s}
#darkness{position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 70%,transparent 20%,#000 85%);transition:opacity .6s}
.evt{display:flex;flex-direction:column;gap:8px}
.evt p{margin:0;font-size:14px;line-height:1.45}

/* ---------- battle ---------- */
#battle .bg{filter:brightness(.6)}
.field{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;justify-content:space-around;padding:0 6px;min-height:0}
.rowlab{display:flex;justify-content:space-between;font-size:10px;color:var(--mute);padding:0 6px}
.urow{display:flex;gap:2px;justify-content:flex-start;align-items:flex-end}
.u{position:relative;width:calc((var(--W) - 20px)/4);display:flex;flex-direction:column;align-items:center;transition:transform .25s,opacity .4s;cursor:pointer}
.u .spr{position:relative;width:100%;aspect-ratio:128/180;max-height:22vh}
.u .spr img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
.u.e .spr img.base{filter:drop-shadow(0 0 3px #000)}
.u .bars{width:86%;display:flex;flex-direction:column;gap:2px}
.u .nm{font-size:10.5px;font-weight:700;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;text-shadow:0 1px 2px #000}
.u .hp{position:relative;height:7px;background:#3a1215;border:1px solid #000;border-radius:2px;overflow:hidden}
.u .hp i{position:absolute;left:0;top:0;bottom:0;background:var(--red);transition:width .3s}
.u .fd{height:4px;background:#22182e;border-radius:2px;overflow:hidden}
.u .fd i{display:block;height:100%;background:var(--fade);transition:width .3s}
.u .fx{display:flex;gap:1px;justify-content:center;min-height:14px;font-size:11px;line-height:14px}
.u .cl{position:absolute;top:2px;left:2px;font-size:10px;background:#000b;border-radius:3px;padding:0 3px;font-weight:800}
.u.act .spr::after{content:"";position:absolute;left:10%;right:10%;bottom:-2px;height:10px;border-radius:50%;background:radial-gradient(var(--gold),transparent 70%)}
.u.act .nm{color:var(--gold)}
.u.tg .spr{outline:2px dashed var(--red);outline-offset:-2px;border-radius:6px;animation:pulse .8s infinite alternate}
.u.tga .spr{outline:2px dashed var(--heal);outline-offset:-2px;border-radius:6px;animation:pulse .8s infinite alternate}
@keyframes pulse{from{background:#ffffff00}to{background:#ffffff14}}
.u.dead{opacity:0;pointer-events:none}
.u.dd .spr img.base{filter:grayscale(.6) brightness(.8) drop-shadow(0 0 6px #c8323f)}
.u.hit{animation:shake .3s}
.u.lunge-h{transform:translateY(-14px) scale(1.04)}
.u.lunge-e{transform:translateY(14px) scale(1.04)}
@keyframes shake{0%,100%{translate:0}20%{translate:-6px}40%{translate:5px}60%{translate:-4px}80%{translate:3px}}
.flt{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-family:var(--hd);font-weight:700;font-size:20px;white-space:nowrap;pointer-events:none;text-shadow:0 2px 0 #000,0 0 6px #000;animation:flt 1.2s forwards;z-index:5}
.flt.s{font-size:14px}
@keyframes flt{0%{opacity:0;margin-top:8px}12%{opacity:1;margin-top:0}75%{opacity:1}100%{opacity:0;margin-top:-34px}}
.shard{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;pointer-events:none;animation:shard 1s forwards;z-index:4}
@keyframes shard{0%{opacity:1;transform:none}100%{opacity:0;transform:translate(var(--dx),40px) rotate(var(--rot)) scale(1.15)}}
.mid{display:flex;align-items:center;gap:8px;padding:2px 6px}
.mid .ln{flex:1;height:1px;background:linear-gradient(90deg,transparent,#c8323f88,transparent)}
.mid .rd{font-size:11px;color:var(--dim)}
#blog{font-size:13px;min-height:36px;line-height:1.35;color:var(--ink);padding:0 2px 6px}
#blog .w{color:var(--gold);font-weight:700}
.skills{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.skills .btn{min-height:58px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11px;line-height:1.15}
.skills .btn .ic{font-size:20px}
.skills .btn.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.skills2{display:flex;gap:5px;margin-top:5px}
.skills2 .btn{flex:1;min-height:38px;font-size:12px;padding:4px}
#skinfo{font-size:12px;color:var(--dim);min-height:17px;margin-top:5px}

#battle .vig,#explore #darkness{animation:torchv 3s infinite alternate}
@keyframes torchv{0%{opacity:.92}35%{opacity:1}60%{opacity:.86}100%{opacity:.97}}
.hearts{color:#e05a7a;font-size:12px;letter-spacing:1px}
/* ---------- CG scene viewer ---------- */
#cgv{position:absolute;inset:0;z-index:45;background:#000;display:none;flex-direction:column;justify-content:center;cursor:pointer}
#cgv.on{display:flex}
#cgv .pic{position:relative;width:100%;aspect-ratio:176/128;background:#000 center/contain no-repeat;image-rendering:pixelated;transition:opacity .5s;border-top:3px double var(--rust);border-bottom:3px double var(--rust)}
#cgv .pic.port{aspect-ratio:128/180;max-height:62vh}
#cgv .txt{margin:14px 16px 0;min-height:110px;padding:12px 14px;background:linear-gradient(#17110d,#0b0807);border:1px solid var(--rust);outline:1px solid #000;outline-offset:-4px;font-size:16px;line-height:1.55}
#cgv .txt b{display:block;font-family:var(--hd);font-weight:400;color:var(--gold);font-size:15px;margin-bottom:2px}
#cgv .txt i{color:var(--dim)}
#cgv .nx{text-align:right;color:var(--mute);font-size:12px;margin:6px 18px 0}
#cgv .skip{position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;z-index:2}
.gal{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.gal div{aspect-ratio:128/180;background:#0c0807 center/contain no-repeat;border:1px solid var(--line);image-rendering:pixelated}
.gal.w{grid-template-columns:repeat(2,1fr)}
.gal.w div{aspect-ratio:176/128}
.gal div.lock{background-image:none!important;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:18px}
.gal div.lock::after{content:"🔒"}
/* ---------- narrator / toast ---------- */
#narr{position:absolute;left:0;right:0;top:20%;z-index:40;text-align:center;padding:12px 24px;pointer-events:none;opacity:0;transition:opacity .5s;background:linear-gradient(90deg,transparent,#000d 20%,#000d 80%,transparent)}
#narr.on{opacity:1}
#narr p{margin:0;font-family:var(--bd);font-weight:600;font-size:18px;color:#e9d6ff;font-style:italic;text-shadow:0 0 12px #8f6bd8,0 2px 0 #000}
#narr small{display:block;color:var(--mute);font-size:11px;margin-top:3px}
#banner{position:absolute;left:0;right:0;top:40%;z-index:41;text-align:center;pointer-events:none;opacity:0;transform:scale(.8);transition:all .35s}
#banner.on{opacity:1;transform:scale(1)}
#banner h2{font-size:36px;color:var(--gold);text-shadow:0 3px 0 #000,0 0 22px #e0b35488}
#banner.bad h2{color:var(--red);text-shadow:0 3px 0 #000,0 0 22px #c8323f88}
#flash{position:absolute;inset:0;z-index:39;pointer-events:none;background:#fff;opacity:0;transition:opacity .25s}
</style>
</head>
<body>
<div id="app">

  <!-- TITLE -->
  <section id="title" class="scr on">
    <div class="bg"></div><div class="vig"></div>
    <div class="torch" style="left:-40px;top:30%"></div><div class="torch" style="right:-40px;top:22%"></div>
    <div class="inner">
      <h1>BARA<br>DEPTHS</h1>
      <div class="sub">ใต้หอปรารถนา</div>
      <p class="tag">นำทีม 4 หนุ่มลงไปในเขาวงกตใต้หอ ประคองสติ รักษาเสื้อผ้า และพาทุกคนกลับมาให้ได้</p>
      <button class="btn red" id="bContinue">เล่นต่อ</button>
      <button class="btn" id="bNew">เริ่มเกมใหม่</button>
    </div>
  </section>

  <!-- TOWN -->
  <section id="town" class="scr">
    <div class="bg"></div><div class="vig"></div>
    <div class="topbar">
      <h2 style="font-size:18px">ค่ายลุงต้น</h2><span class="sp"></span>
      <span class="chip">สัปดาห์ <b id="tWeek">1</b></span>
      <span class="chip gold-t">🪙 <b id="tGold">0</b></span>
    </div>
    <div class="main scroll">
      <div class="bld">
        <button class="go" id="bEmbark"><b>⚔️ ออกสำรวจ</b><span id="tNext">เลือกทีมและลงสู่ใต้หอ</span></button>
        <button id="bOnsen"><b>♨️ ออนเซ็น</b><span>คลายความหลงลืม · พักหนึ่งสัปดาห์</span></button>
        <button id="bTailor"><b>🧵 ร้านตัดเสื้อ</b><span>ซ่อมเสื้อผ้า · เสริมผ้าเหนียว</span></button>
        <button id="bGym"><b>🏋️ ยิม</b><span>อัปเกรดพลังโจมตี</span></button>
        <button id="bGate"><b>🚪 ประตูมิติ</b><span>รับหนุ่มใหม่เข้าค่าย</span></button>
        <button id="bGallery"><b>🖼️ ห้องภาพ</b><span>ภาพตัวละครและฉากที่ปลดล็อกแล้ว</span></button>
        <button id="bBonds"><b>💞 ความสัมพันธ์</b><span>ความสนิทกับคุณ · คู่หูในทีม</span></button>
      </div>
      <div style="padding:4px 12px 2px;display:flex;justify-content:space-between;align-items:baseline">
        <h3 style="font-size:15px">ทีมในค่าย <span class="dim" id="tCount"></span></h3>
        <span class="dim" style="font-size:12px">แตะเพื่อดูรายละเอียด</span>
      </div>
      <div class="rgrid" id="tRoster" style="padding:6px 12px 16px"></div>
      <div style="padding:0 12px calc(20px + env(safe-area-inset-bottom));display:flex;gap:8px">
        <button class="btn" id="bHelp" style="flex:1">📖 วิธีเล่น</button>
        <button class="btn" id="bMenu" style="flex:1">⚙️ เมนู</button>
      </div>
    </div>
  </section>

  <!-- EXPLORE -->
  <section id="explore" class="scr">
    <div class="bg" id="xBg"></div>
    <div id="darkness"></div>
    <div class="topbar">
      <span class="chip" id="xArea">—</span><span class="sp"></span>
      <span class="chip gold-t">🪙 <b id="xGold">0</b></span>
    </div>
    <div style="position:relative;z-index:2;display:flex;align-items:center;gap:8px;padding:0 12px 8px">
      <span style="font-size:16px">🏮</span><div id="lightbar"><i></i></div><b id="xLight" style="font-size:13px;width:28px;text-align:right">100</b>
    </div>
    <div id="map"></div>
    <div class="party" id="xParty"></div>
    <div class="sheet" id="xSheet"></div>
  </section>

  <!-- BATTLE -->
  <section id="battle" class="scr">
    <div class="bg" id="bBg"></div><div class="vig"></div>
    <div class="topbar" style="padding-bottom:2px">
      <span class="chip" id="bRound">รอบ 1</span><span class="sp"></span>
      <span class="chip">🏮 <b id="bLight">100</b></span>
    </div>
    <div class="field">
      <div><div class="rowlab"><span>◀ แนวหน้า (แถว 1)</span><span>แถว 4</span></div><div class="urow" id="eRow"></div></div>
      <div class="mid"><div class="ln"></div><span class="rd">⚔</span><div class="ln"></div></div>
      <div><div class="urow" id="hRow"></div><div class="rowlab"><span>◀ แนวหน้า (แถว 1)</span><span>แถว 4</span></div></div>
    </div>
    <div class="sheet">
      <div id="blog"></div>
      <div class="skills" id="bSkills"></div>
      <div class="skills2" id="bSkills2"></div>
      <div id="skinfo"></div>
    </div>
  </section>

function load() { try { const s = JSON.parse(localStorage.getItem('baraDepths1')); return s && s.v === 1 ? norm(s) : null; } catch (e) { return null; } }
function norm(s) { s.seen = s.seen || { spr: {}, cg: [] }; s.roster.forEach(h => { h.love = h.love || 0; h.bond = h.bond || {}; }); return s; }

function mkHero(d) {
  const max = clamp(d.outfit, 1, 2);
  return { uid: uid(), id: d.id, name: d.name, tribe: d.tribe, pow: d.pow, grit: d.grit, lvl: 0, xp: 0, fade: 0, mood: null,
    cloth: max, clothMax: max, gear: 0, trait: pick(TRAITS).n, busy: 0, kills: 0, runs: 0, love: 0, bond: {} };
}
const trait = h => TRAITS.find(t => t.n === h.trait) || {};
function hStats(h) {
  const c = CLS[h.tribe], t = trait(h);
  return {
    hpMax: c.hp + h.grit * 2 + h.lvl * 3 + (t.hp || 0),
    spd: c.spd + Math.floor(h.lvl / 2) + (t.spd || 0),
    dmin: c.dmg[0] + Math.floor(h.pow / 2) + h.lvl + h.gear,
    dmax: c.dmg[1] + h.pow + h.lvl + h.gear * 2,
    crit: c.crit + h.lvl * 2 + (t.crit || 0),
    dodge: c.dodge + h.lvl * 3,
    acc: h.lvl * 3 + (t.acc || 0),
    prot: c.prot + (t.prot || 0),
  };
}
function newGame() {
  S = { v: 1, gold: 500, week: 1, roster: ['ben', 'tiger', 'dave', 'jay'].map(id => mkHero(BYID[id])), recruits: [], items: {},
    tailor: 0, unlocked: 1, beaten: [], dead: [], freed: 0, seenHelp: false, run: null, seen: { spr: {}, cg: [] } };
  rollRecruits(); save();
}
function rollRecruits() {
  const have = new Set(S.roster.map(h => h.id).concat(S.dead.map(d => d.id)));
  const pool = ROSTER.filter(r => r.tribe !== 'warden' && !have.has(r.id));
  S.recruits = shuffle(pool).slice(0, 3).map(r => r.id);
}

/* ---------------- UI helpers ---------------- */
function show(id) { document.querySelectorAll('.scr').forEach(s => s.classList.toggle('on', s.id === id)); }
function modal(html, onBind) {
  const m = $('#modal'), b = m.querySelector('.box'); b.innerHTML = html; m.classList.add('on');
  b.querySelectorAll('[data-close]').forEach(x => x.onclick = closeModal);
  onBind && onBind(b);
}
function closeModal() { $('#modal').classList.remove('on'); }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal' && !$('#modal').dataset.lock) closeModal(); });
function ask(title, text, btns) {
  if (window.AUTOASK) return Promise.resolve(window.AUTOASK(title, btns));
  return new Promise(res => {
    $('#modal').dataset.lock = '1';
    modal(`<h3>${title}</h3><div class="body"><p style="margin:0;line-height:1.5">${text}</p></div><div class="row">${btns.map((b, i) => `<button class="btn ${b.cls || ''}" data-i="${i}" ${b.dis ? 'disabled' : ''}>${b.t}</button>`).join('')}</div>`,
      box => box.querySelectorAll('[data-i]').forEach(x => x.onclick = () => { delete $('#modal').dataset.lock; closeModal(); res(+x.dataset.i); }));
  });
}

function genMap(n) {
  const W = 4, H = 4, key = (x, y) => x + ',' + y;
  const rooms = {}, edges = new Set();
  const sx = R(0, W - 1), sy = H - 1;
  rooms[key(sx, sy)] = { x: sx, y: sy };
  const ek = (a, b) => [a, b].sort().join('|');
  while (Object.keys(rooms).length < n) {
    const r = pick(Object.values(rooms)), [dx, dy] = pick([[1, 0], [-1, 0], [0, 1], [0, -1]]);
    const nx = r.x + dx, ny = r.y + dy; if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
    const k = key(nx, ny);
    if (!rooms[k]) { rooms[k] = { x: nx, y: ny }; edges.add(ek(key(r.x, r.y), k)); }
    else if (chance(.12)) edges.add(ek(key(r.x, r.y), k));
  }
  // BFS from start, boss is farthest
  const adj = {}; Object.keys(rooms).forEach(k => adj[k] = []);
  edges.forEach(e => { const [a, b] = e.split('|'); adj[a].push(b); adj[b].push(a); });
  const dist = { [key(sx, sy)]: 0 }, q = [key(sx, sy)];
  while (q.length) { const c = q.shift(); adj[c].forEach(nb => { if (dist[nb] == null) { dist[nb] = dist[c] + 1; q.push(nb); } }); }
  const far = Object.keys(rooms).sort((a, b) => dist[b] - dist[a])[0];
  Object.entries(rooms).forEach(([k, r]) => {
    r.k = k; r.seen = false; r.done = false;
    r.t = k === key(sx, sy) ? 'entry' : k === far ? 'boss' : pick(['battle', 'battle', 'battle', 'curio', 'curio', 'treasure', 'empty']);
  });
  rooms[key(sx, sy)].seen = rooms[key(sx, sy)].done = true;
  const halls = {}; edges.forEach(e => halls[e] = { segs: [pickSeg(), pickSeg()], done: false });
  return { rooms, adj, halls, cur: key(sx, sy) };
}
function pickSeg() { const r = Math.random(); return r < .18 ? 'battle' : r < .36 ? 'curio' : r < .46 ? 'trap' : 'empty'; }

async function travel(k) {
  const M = RUN.map;
  if (k === M.cur || !M.adj[M.cur].includes(k) || RUN.busy) return;
  RUN.busy = true;
  const hk = [M.cur, k].sort().join('|'), hall = M.halls[hk];
  sfx('ui');
  for (let i = 0; i < hall.segs.length; i++) {
    renderParty(true);
    for (let s = 0; s < 3; s++) { sfx('step'); await sleep(170); }
    const bg = $('#xBg'); bg.style.backgroundPosition = `${50 + (RUN.steps % 2 ? 6 : -6)}% center`;
    RUN.steps++;
    setLight(RUN.light - 5);
    renderExplore('กำลังเดินผ่านทางเดิน...'); renderParty(true);
    if (lightMod() >= 2 && chance(.25)) { partyHeroes().filter(h => !trait(h).dark).forEach(h => addFadeQuiet(h, 3)); }
    if (RUN.steps % 5 === 0) await hunger();
    if (!hall.done) { const ev = hall.segs[i]; hall.segs[i] = 'empty'; if (!(await doEvent(ev, true))) return; }
  }
  hall.done = true; M.cur = k; const room = M.rooms[k]; room.seen = true;
  renderParty(false);
  if (!room.done) {

    if (!ok) return;
  } else renderExplore();
  if (RUN) RUN.busy = false;
}

}

async function doEvent(t, hall) {
  const ps = partyHeroes();
  if (t === 'empty' || t === 'entry') { renderExplore(hall ? undefined : 'ห้องว่าง... เงียบจนได้ยินเสียงหัวใจตัวเอง'); return true; }
  if (t === 'trap') {
    const otter = ps.some(h => h.tribe === 'otter');
    if (chance(otter ? .6 : .3)) { renderExplore('🪤 เจอกับดัก แต่ทีมหลบทัน'); await sleep(600); return true; }
    const h = pick(ps); h.hp = Math.max(0, h.hp - R(3, 6)); if (h.hp === 0) h.dd = true; addFadeQuiet(h, 10); sfx('hit'); flash('#c8323f', .35);
    await ask('🪤 กับดัก!', `${h.name} เหยียบกับดักเข้าเต็มๆ`, [{ t: 'ไปต่อ' }]); renderExplore(); return true;
  }
  if (t === 'treasure') { const g = Math.round(R(60, 120) * (1 + lightMod() * .15)); RUN.gold += g; sfx('coin'); await ask('💰 หีบสมบัติ', `ได้ทอง ${g}🪙` + (chance(.35) ? (RUN.items.sew = (RUN.items.sew || 0) + 1, ' และชุดเย็บผ้า 1') : ''), [{ t: 'เก็บ' }]); renderExplore(); return true; }
  if (t === 'curio') return curio();
  if (t === 'boss') await bossIntro();
  if (t === 'battle' || t === 'boss') {
    const res = await battle(t === 'boss');
    if (res === 'wipe') { endRun(false, true); return false; }
    if (res === 'flee') { renderExplore('หนีออกมาได้... แต่ศัตรูยังอยู่ที่เดิม'); return true; }
    if (t === 'boss') RUN.bossDown = true;
    await afterBattle(t === 'boss');

  }

}

function endRun(success, wipe) {
  const ps = partyHeroes(), area = AREAS.find(a => a.id === RUN.area);
  let bonus = 0;
  if (success) {
    bonus = Math.round((RUN.len === 'med' ? 260 : 150) * (1 + (area.lv - 1) * .35));
    if (RUN.bossDown && !S.beaten.includes(area.id)) { S.beaten.push(area.id); S.unlocked = Math.min(AREAS.length, Math.max(S.unlocked, area.lv + 1)); }
  }
  const mult = RUN.len === 'med' ? 1.6 : 1;
  const total = Math.round((RUN.gold + bonus) * (success ? mult : 1));
  S.gold += total;
  const lines = [];
  ps.forEach((h, i) => { h.love = Math.min(10, h.love + 1 + (success ? 1 : 0)); ps.forEach((o, j) => { if (j > i) addBond(h, o, 1 + (Math.abs(i - j) === 1 ? 1 : 0)); }); });
  ps.forEach(h => {
    const before = h.lvl;
    h.xp += RUN.xp + (success ? 2 : 0); h.lvl = Math.min(XP_LV.length - 1, lvOf(h.xp));
    lines.push(`${h.name}: XP +${RUN.xp + (success ? 2 : 0)}${h.lvl > before ? ' <b class="gold-t">เลเวลอัป! Lv' + h.lvl + '</b>' : ''}`);
    delete h.hp; delete h.dd; delete h.blessed;
  });
  const lost = RUN.lost.map(n => `<span class="red-t">✝ ${n}</span>`).join('<br>');
  S.week++; rollRecruits(); RUN = null; save();
  const title = wipe ? 'ทีมถูกหอกลืนทั้งหมด' : success ? 'ภารกิจสำเร็จ' : 'ถอยกลับค่าย';
  const ending = success && area.id === 'casino' && S.beaten.length === AREAS.length;
  ask(title, `ได้รับ ${total}🪙${success && mult > 1 ? ' (รวมโบนัสระยะกลาง)' : ''}<br>${lines.join('<br>')}${lost ? '<br>' + lost : ''}`, [{ t: 'กลับค่าย', cls: 'red' }]).then(() => {
    renderTown();
    if (ending) ask('ราชันล้มลง', 'หน้ากากของวาเอลร้าวเป็นเสี่ยง ภายใต้นั้นคือใบหน้าที่คุณคุ้นเคยที่สุด... ใบหน้าของตัวคุณเอง<br><br><span class="dim">ขอบคุณที่เล่น Bara Depths · เล่นต่อเพื่อฟาร์มและปลดปล่อยหนุ่มๆ ได้</span>', [{ t: 'จบ' }]);
  });
}

function mkEnemy(id, lv, boss) {
  const d = BYID[id], e = EN[id];

      <div class="body">${tab === 'spr'
        ? `<div class="gal">${ids.map(id => best(id) ? `<div data-id="${id}" style="background-image:url(${art(id, best(id))})"></div>` : '<div class="lock"></div>').join('')}</div>`
        : `<div class="gal w">${cgs.map((c, i) => S.seen.cg.includes(c) ? `<div data-c="${i}" style="background-image:url(${c})"></div>` : '<div class="lock"></div>').join('')}</div>`}
      <p class="dim" style="font-size:12px;margin:0">เจอตัวละครในการต่อสู้/ค่าย หรือถอดชุดจนหมดเพื่อปลดล็อกภาพเพิ่ม · ฉากปลดล็อกจากแคมป์ บอส และค่ำคืนพิเศษ</p></div>
      <div class="row"><button class="btn red" data-close>ปิด</button></div>`, b => {
      b.querySelectorAll('[data-t]').forEach(x => x.onclick = () => { tab = x.dataset.t; draw(); });
      b.querySelectorAll('[data-id]').forEach(x => x.onclick = async () => { const id = x.dataset.id; closeModal();
        await scene(['A', 'A1', 'B'].filter(k => (S.seen.spr[id] || []).includes(k)).map(k => ({ img: art(id, k), port: true, t: BYID[id].name }))); draw(); });
      b.querySelectorAll('[data-c]').forEach(x => x.onclick = async () => { closeModal(); await scene([{ img: cgs[+x.dataset.c], t: '' }]); draw(); });
    });
  };
  draw();
};
$('#bBonds').onclick = () => {
  const pairs = [];
  S.roster.forEach((a, i) => S.roster.forEach((b, j) => { if (j > i && bondLv(a, b)) pairs.push([a, b, bondLv(a, b)]); }));
  modal(`<h3>💞 ความสัมพันธ์</h3><div class="body">
    <b>ความสนิทกับคุณ</b><div class="dim" style="font-size:12px">ครบ ♥♥♥ ปลดล็อก "ค่ำคืนพิเศษ" ในหน้าข้อมูลตัวละคร</div>
    ${S.roster.map(h => `<div class="item"><span>${h.name}</span><span class="hearts">${heartStr(hearts(h))} <span class="dim">${h.love}/10</span></span></div>`).join('')}
    <b>คู่หูในทีม</b>${pairs.length ? pairs.sort((x, y) => y[2] - x[2]).map(([a, b, l]) => `<div class="item"><span>${a.name} × ${b.name}</span><span class="hearts">${heartStr(l)}</span></div>`).join('') : '<p class="dim" style="margin:0">ยังไม่มี · ส่งคนออกสำรวจด้วยกันหรือทำกิจกรรมที่แคมป์</p>'}
    </div><div class="row"><button class="btn red" data-close>ปิด</button></div>`);
};

/* ========================= BOOT ========================= */
S = load();
$('#bContinue').style.display = S ? '' : 'none';
$('#bContinue').onclick = () => { sfx('ui'); renderTown(); };
$('#bNew').onclick = async () => {
  if (S && !await ask('เริ่มใหม่?', 'เซฟเดิมจะถูกลบ', [{ t: 'ไม่' }, { t: 'เริ่มใหม่', cls: 'red' }])) return;
  newGame(); sfx('ui'); await intro(); renderTown();
};
</script>
