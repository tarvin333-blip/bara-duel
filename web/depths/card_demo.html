<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Card Demo</title>
<style>
:root{--bone:#ece2c8;--gold:#8a6a3a}
body{margin:0;background:#0b0a09;color:var(--bone);font-family:serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow:hidden}
.card{--k:.28;position:relative;width:calc(800px*var(--k));height:calc(1200px*var(--k));margin-top:calc(216px*var(--k));cursor:pointer;user-select:none}
.card .bg{position:absolute;inset:0;background:url(../art/bg/forge.png) center/cover;filter:brightness(.5) saturate(.8);border-radius:6px}
.card .frame{position:absolute;inset:0;border:5px solid var(--gold);border-radius:6px;box-shadow:inset 0 0 0 2px #2a1d10,inset 0 0 40px #000,0 8px 30px #000}
.card .art{position:absolute;width:calc(1024px*var(--k));height:calc(1536px*var(--k));left:calc(-112px*var(--k));top:calc(-256px*var(--k));pointer-events:none}
.card .art img{position:absolute;inset:0;width:100%;height:100%;transition:opacity .35s}
.card .cen{position:absolute;transform:translate(-50%,-50%) rotate(var(--r));background:#0a0807;border:1px solid var(--gold);box-shadow:0 2px 6px #000a;display:grid;place-items:center;color:#b33;font:800 calc(26px*var(--k))/1 serif;letter-spacing:.14em;opacity:0;transition:opacity .3s}
.card .plate{position:absolute;left:0;right:0;bottom:0;height:calc(160px*var(--k));background:linear-gradient(#1a1410ee,#0d0a08);border-top:2px solid var(--gold);border-radius:0 0 6px 6px;text-align:center;font-size:16px;padding-top:6px;box-sizing:border-box}
.card .plate small{display:block;color:#a8987a;font-size:11px}
.card .pips{position:absolute;top:8px;right:8px;display:flex;gap:3px;z-index:3}.card .pips i{width:8px;height:8px;border:1px solid var(--gold);background:#d9c08a}.card .pips i.off{background:transparent}
.card.hit{animation:hit .35s}@keyframes hit{20%{transform:translateX(-7px) rotate(-1.5deg)}50%{transform:translateX(5px)}80%{transform:translateX(-2px)}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;border-radius:6px;mix-blend-mode:overlay}
.card.hit .flash{animation:fl .35s}@keyframes fl{0%{opacity:.9}100%{opacity:0}}
.shred{position:absolute;width:14px;height:8px;background:#6b4a2e;pointer-events:none;z-index:4;animation:shred .9s ease-out forwards}
@keyframes shred{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rt));opacity:0}}
.bub{position:absolute;left:50%;top:calc(-150px*var(--k));transform:translateX(-50%);background:#0d0b09ee;border:1px solid var(--gold);padding:5px 10px;font-size:13px;white-space:nowrap;z-index:5;animation:bub 2.2s forwards}
@keyframes bub{0%{opacity:0;transform:translate(-50%,6px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.row{display:flex;gap:8px}
button{background:#15110e;color:var(--bone);border:1px solid var(--gold);padding:8px 14px;font:14px serif;cursor:pointer}
#full{position:fixed;inset:0;background:#050403;display:none;align-items:center;justify-content:center;z-index:9}
#full.on{display:flex}
#full .wrap{position:relative;height:96vh;aspect-ratio:1024/1536}
#full .wrap img{position:absolute;inset:0;width:100%;height:100%}
.hint{color:#8b857a;font-size:12px}
</style></head><body>
<div class="card" id="c"><div class="bg"></div><div class="frame"></div><div class="art" id="art"></div><div class="flash"></div><div class="pips" id="pips"></div>
  <div class="plate"><span id="nm"></span><small id="st"></small></div></div>
<div class="row"><button id="hitB">โดนตี (ฉีกผ้า)</button><button id="fullB">ดูเต็มจอ</button><button id="resetB">เริ่มใหม่</button></div>
<div class="hint">การ์ดเล็กใช้แถบ SECRET · ดูเต็มจอใช้โมเสก</div>
<div id="full"><div class="wrap" id="fw"></div></div>
<script src="cast.js"></script>
<script>
const id = 'brannok', C = CAST[id], STN = ['', 'ชุดเต็ม', 'เสื้อขาด', 'ชั้นใน', 'เปลือย'];
const src = s => `../art/paint/${id}_${s}.webp`;
let st = 1;
const art = document.getElementById('art');
for (let s = 1; s <= 4; s++) { const im = new Image(); im.src = src(s); im.style.opacity = s === 1 ? 1 : 0; art.appendChild(im); }
const cen = document.createElement('div'); cen.className = 'cen'; cen.textContent = 'SECRET'; art.appendChild(cen);
function draw() {
  [...art.querySelectorAll('img')].forEach((im, i) => im.style.opacity = i + 1 === st ? 1 : 0);
  const c = (C.censor || {})[st];
  if (c) { const [x, y, w, h, r] = c; Object.assign(cen.style, { left: x / 1024 * 100 + '%', top: y / 1536 * 100 + '%', width: w / 1024 * 100 + '%', height: h / 1536 * 100 + '%', opacity: 1 }); cen.style.setProperty('--r', r + 'deg'); }
  else cen.style.opacity = 0;
  document.getElementById('nm').textContent = C.short; document.getElementById('st').textContent = `สเตจ ${st} · ${STN[st]}`;
  document.getElementById('pips').innerHTML = [1, 2, 3].map(i => `<i class="${i <= 4 - st ? '' : 'off'}"></i>`).join('');
}
function bark(kind) { const L = C.barks[kind]; if (!L) return; const b = document.createElement('div'); b.className = 'bub'; b.textContent = L[Math.random() * L.length | 0];
  document.getElementById('c').appendChild(b); setTimeout(() => b.remove(), 2300); }
function hit() {
  const c = document.getElementById('c'); c.classList.remove('hit'); void c.offsetWidth; c.classList.add('hit');
  if (st >= 4) { bark('dd'); return; }
  st++; draw();
  for (let i = 0; i < 10; i++) { const s = document.createElement('div'); s.className = 'shred';
    s.style.left = 40 + Math.random() * 20 + '%'; s.style.top = 30 + Math.random() * 30 + '%';
    s.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px'); s.style.setProperty('--dy', (Math.random() * 80 + 30) + 'px'); s.style.setProperty('--rt', (Math.random() * 360) + 'deg');
    c.appendChild(s); setTimeout(() => s.remove(), 950); }
  bark(st === 4 ? 'bare' : 'tear');
}
document.getElementById('c').onclick = hit; document.getElementById('hitB').onclick = hit;
document.getElementById('resetB').onclick = () => { st = 1; draw(); bark('start'); };
document.getElementById('fullB').onclick = () => {
  const fw = document.getElementById('fw'); fw.innerHTML = `<img src="${src(st)}">`;
  const m = (C.mosaic || {})[st];
  if (m) { const im = new Image(); im.src = `../art/paint/${id}_${st}_mosaic.png`; im.onload = () => Object.assign(im.style, { inset: 'auto', left: m[0] / 1024 * 100 + '%', top: m[1] / 1536 * 100 + '%', width: im.naturalWidth / 1024 * 100 + '%', height: im.naturalHeight / 1536 * 100 + '%', imageRendering: 'pixelated' }); fw.appendChild(im); }
  document.getElementById('full').classList.add('on');
};
document.getElementById('full').onclick = () => document.getElementById('full').classList.remove('on');
draw();
</script></body></html>
