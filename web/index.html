<title>Bara Duel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;600;700&family=Chakra+Petch:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen duel table — enemy bar, enemy lanes, chain rail, player lanes, player bar, hand dock.
   Deliberately single dark theme: a locker-room-at-night arcade table. */
:root{
  --bg:#190f1d; --felt:#231529; --panel:#2f1d37; --line:#4d3557;
  --ink:#140a12; --paper:#f8ece2; --muted:#bca7c2;
  --hot:#ff4a5c; --gold:#ffc23d; --blue:#49b8ff;
  --f-display:'Pixelify Sans','Chakra Petch','Noto Sans Thai',system-ui,sans-serif;
  --f-body:'Chakra Petch','Noto Sans Thai',system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow-x:hidden}
body{
  background:var(--bg); color:var(--paper); font-family:var(--f-body); overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent; user-select:none;
}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:radial-gradient(ellipse at 50% 50%, var(--felt), var(--bg) 70%),var(--bg)}
body[data-scene="sauna"]::after{background:radial-gradient(ellipse at 50% 50%,#3a2418,var(--bg) 70%)}
body[data-scene="gym"]::after{background:radial-gradient(ellipse at 50% 50%,#3a1a1e,var(--bg) 70%)}
body[data-scene="beach"]::after{background:radial-gradient(ellipse at 50% 50%,#173544,var(--bg) 70%)}
body[data-scene="locker"]::after{background:radial-gradient(ellipse at 50% 50%,#1f2a3a,var(--bg) 70%)}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* bars */
.bar{display:flex;align-items:center;gap:6px;min-width:0;min-height:44px;padding-block:4px}
.hp{display:flex;align-items:baseline;gap:6px;font-family:var(--f-display);white-space:nowrap}
.hp b{font:800 26px/1 var(--f-display);font-variant-numeric:tabular-nums}
.hp small{font-size:11px;color:var(--muted);letter-spacing:.06em}
.who-l{font:700 13px var(--f-display);padding:3px 10px;border-radius:99px;background:var(--panel);border:1px solid var(--line)}
.meta{font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center}
.backs{display:flex}
.backs i{width:10px;height:14px;border-radius:2px;background:linear-gradient(135deg,var(--hot),#7a1f4a);border:1px solid var(--ink);margin-left:-3px}
.sp{flex:1}
.ap{display:flex;gap:5px;align-items:center}
.ap small{font-size:11px;color:var(--muted);margin-right:2px}
.ap i{width:14px;height:14px;border-radius:50%;border:2px solid var(--gold);background:transparent}
.ap i.on{background:var(--gold);box-shadow:0 0 8px var(--gold)}
#endBtn{white-space:nowrap;font:800 15px var(--f-display);padding:8px 16px;border-radius:10px;border:2px solid var(--ink);background:var(--hot);box-shadow:0 3px 0 var(--ink)}
#endBtn:disabled{background:var(--panel);color:var(--muted);box-shadow:none}
#helpBtn{width:38px;height:38px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-weight:700}
.bar.hit{animation:barHit .45s}
@keyframes barHit{20%{transform:translateX(-6px);color:var(--hot)}40%{transform:translateX(6px)}60%{transform:translateX(-3px)}}

/* lanes */
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,3vw,16px);
  width:min(100%,420px,max(234px,calc((100vh - 370px)*1.1)));margin:0 auto;padding-top:22px}
@supports(height:100dvh){.row{width:min(100%,420px,max(234px,calc((100dvh - 370px)*1.1)))}}
.slot{position:relative;aspect-ratio:100/140;border:2px dashed var(--line);border-radius:9px}
.slot::before{content:attr(data-l);position:absolute;inset:0;display:grid;place-items:center;font:700 11px var(--f-display);color:var(--line);letter-spacing:.1em}
.slot.tgt{border-color:var(--gold);border-style:solid;box-shadow:0 0 0 3px #ffc23d33,0 0 18px #ffc23d55;cursor:pointer;animation:pulse 1s infinite alternate}
@keyframes pulse{to{box-shadow:0 0 0 5px #ffc23d22,0 0 26px #ffc23d88}}

/* board card */
.card{position:absolute;inset:-2px;container-type:inline-size;cursor:pointer}
.card .art{position:absolute;left:0;width:100%;top:-17.143%;height:117.143%;pointer-events:none}
.card .art svg{width:100%;height:100%;display:block;overflow:visible}
.card .panel{position:absolute;left:3%;right:3%;bottom:2.4%;height:27%;border-radius:0 0 6cqw 6cqw;
  background:linear-gradient(180deg,transparent,#140a12e6 34%);display:flex;flex-direction:column;justify-content:flex-end;padding:0 6cqw 4cqw;pointer-events:none}
.card .nm{font:700 10cqw/1.15 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 0 var(--ink)}
.card .st{display:flex;align-items:center;gap:5cqw;font:800 13cqw/1 var(--f-display);font-variant-numeric:tabular-nums}
.card .st .p.up{color:var(--gold)} .card .st .p.dn{color:var(--blue)}
.card .st .g{color:#ff8fa0}
.pips{display:flex;gap:.5cqw;margin-left:auto;font-size:11cqw;line-height:1}
.pips i{font-style:normal;filter:drop-shadow(0 0 1cqw #000)}
.pips i.off{opacity:.22;filter:grayscale(1)}
.ic{position:absolute;top:4cqw;width:21cqw;height:21cqw;border-radius:50%;display:grid;place-items:center;font-size:12.5cqw;box-shadow:0 0 0 1.2cqw #fff8;
  background:var(--c);border:1.6cqw solid var(--ink);pointer-events:none;z-index:2}
.ic.in{left:4cqw}.ic.out{right:4cqw}
.tags{position:absolute;top:25cqw;left:4cqw;display:flex;flex-direction:column;gap:2cqw;align-items:flex-start;pointer-events:none;z-index:2}
.tag{font:800 7.5cqw/1 var(--f-display);padding:1.6cqw 3cqw;border-radius:2cqw;border:1cqw solid var(--ink);letter-spacing:.04em}
.tag.bare{background:var(--hot)} .tag.mid{background:#ffb347;color:var(--ink)} .tag.wet{background:var(--blue);color:var(--ink)} .tag.stun{background:#ff6fb5;color:var(--ink)} .tag.rest{background:var(--panel);color:var(--muted)}
.card.tgt .art{filter:drop-shadow(0 0 5px var(--gold)) drop-shadow(0 0 10px var(--gold))}
.card .flash{position:absolute;inset:0;border-radius:7%;background:transparent;opacity:0;pointer-events:none;z-index:4}
.float{position:absolute;left:50%;top:32%;z-index:8;pointer-events:none;white-space:nowrap;
  font:italic 900 22cqw/1 var(--f-display);color:#fff;-webkit-text-stroke:2cqw var(--ink);paint-order:stroke fill}
.shards{position:absolute;left:0;top:-17.143%;width:100%;height:117.143%;pointer-events:none;z-index:6}
.shard{position:absolute;inset:0;will-change:transform,opacity;contain:strict}
.shard svg{width:100%;height:100%;display:block;overflow:visible}
.bit{position:absolute;left:50%;top:42%;width:7%;height:3.4%;border:1px solid var(--ink);z-index:7;pointer-events:none}
.ring{position:absolute;left:50%;top:55%;width:60%;aspect-ratio:1;border:4px solid var(--gold);border-radius:50%;pointer-events:none;z-index:1}

/* mid rail */
.mid{display:flex;flex-direction:column;gap:4px;padding-block:6px;align-items:center}
.chain{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.cc{font:italic 900 24px/1 var(--f-display);color:var(--gold);letter-spacing:.02em}
.cc small{font-size:12px;color:var(--muted);font-style:normal;font-weight:700;letter-spacing:.12em;margin-right:4px}
.seq{display:flex;gap:3px}
.chip{font-size:12px;padding:1px 5px;border-radius:6px;background:var(--panel);border:1px solid var(--line)}
.ms{display:flex;gap:4px}
.ms span{font:800 10px var(--f-display);padding:2px 6px;border-radius:99px;border:1px solid var(--line);color:var(--muted);letter-spacing:.06em}
.ms span.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.ms span.on.b{background:var(--hot);border-color:var(--hot);color:#fff}
.next{font-size:12px;color:var(--muted)}
.ico{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--c);border:2px solid var(--ink);box-shadow:0 0 0 2px #fff9;font-size:14px;font-style:normal;vertical-align:middle}
.line2{display:flex;gap:8px;align-items:center;font-size:12px;max-width:100%}
#log{color:var(--paper);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#scene{font:700 11px var(--f-display);padding:2px 8px;border-radius:99px;background:#ffffff14;border:1px solid var(--line);white-space:nowrap}

/* hand: a fan that always fits on one screen */
:root{--cw:96px;--ch:calc(var(--cw)*1.43)}
.hand{position:relative;flex:none;height:calc(var(--ch) + 44px);margin-top:auto;margin-bottom:env(safe-area-inset-bottom,0px)}
.hcard{position:absolute;left:50%;bottom:22px;width:var(--cw);aspect-ratio:100/143;container-type:inline-size;transform-origin:50% 110%;
  border-radius:7cqw;border:2px solid var(--ink);background:var(--paper);color:var(--ink);padding:0;text-align:left;overflow:hidden;
  box-shadow:0 3px 0 var(--ink),0 8px 16px #0009;transition:transform .34s cubic-bezier(.2,.8,.3,1.12),filter .2s,box-shadow .2s;touch-action:none;will-change:transform}
.hcard.static{position:relative;left:auto;bottom:auto;transform:none;transition:none;width:100%}
.hcard.drag{transition:none;box-shadow:0 22px 34px #000c,0 0 0 3px var(--gold)}
.hcard.off{filter:saturate(.3) brightness(.68)}
.hcard.chain{box-shadow:0 3px 0 var(--ink),0 0 0 3px var(--gold),0 0 18px #ffc23daa}
.hcard.sel{box-shadow:0 3px 0 var(--ink),0 0 0 3px #fff,0 0 22px #fff8}
.hcard.new::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,#ff4a5c 0 6px,#c92a50 6px 12px);
  animation:unveil .22s ease-out var(--dl,0s) forwards}
@keyframes unveil{to{opacity:0;transform:scaleX(0)}}
.face{display:flex;flex-direction:column;height:100%}
.hbar{flex:none;height:21cqw;display:flex;align-items:center;gap:2cqw;padding:0 3cqw;background:var(--ink);color:var(--paper)}
.hcard.chain .hbar{background:linear-gradient(90deg,#ffc23d,#ff8a3d)}
.cost{flex:none;width:17cqw;height:17cqw;border-radius:50%;background:var(--gold);box-shadow:0 0 0 1.2cqw #fff6;display:grid;place-items:center;font:800 11.5cqw/1 var(--f-display);color:var(--ink)}
.cost.red{background:#7dffb0}
.was{font:700 8cqw var(--f-display);color:#ff8fa0;text-decoration:line-through}
.hcard.chain .was{color:var(--ink)}
.hbar .lv{font:800 8.5cqw var(--f-display);color:var(--gold);letter-spacing:.04em}
.hbar .icons{margin-left:auto;display:flex;align-items:center;gap:1cqw;font:800 9cqw var(--f-display)}
.hbar .icons em{font-style:normal;font-size:8.5cqw;letter-spacing:.06em}
.hbar .ico{width:19cqw;height:19cqw;font-size:11.5cqw;border-width:1cqw;box-shadow:0 0 0 1cqw #fffa}
.hart{flex:none;height:64cqw;position:relative;overflow:hidden;background:var(--tc,#555)}
.hart svg{width:100%;height:100%;display:block}
.hn{font:700 12.5cqw/1.15 var(--f-display);padding:2.5cqw 4cqw 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hst{font:800 8.6cqw/1.2 var(--f-display);padding:0 4cqw;color:#7a2f45;white-space:nowrap;overflow:hidden}
.ht{font-size:9cqw;line-height:1.22;padding:1cqw 4cqw 0;color:#3a2a33;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sfx{position:absolute;inset:0;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 50%,#ffffff55 0 20%,transparent 21%),repeating-conic-gradient(from 0deg,#ffffff22 0 6deg,transparent 6deg 14deg),var(--tc)}
.sfx b{font:italic 900 21cqw/1 var(--f-display);color:#fff;-webkit-text-stroke:1.8cqw var(--ink);paint-order:stroke fill;transform:rotate(-8deg);letter-spacing:.02em}
.hart .scn{position:absolute;inset:0;display:grid;place-items:center;font:800 14cqw var(--f-display);color:#fff;text-shadow:0 2px 0 var(--ink);letter-spacing:.08em}
.hcount{position:absolute;right:0;bottom:calc(var(--ch) + 14px);font:700 11px var(--f-display);color:var(--muted)}
.slot.hov,.card.hov .art{outline:3px solid #fff;outline-offset:2px}
.fly{position:fixed!important;z-index:95;margin:0;pointer-events:none;transition:none!important}
.fly.back{background:repeating-linear-gradient(45deg,#ff4a5c 0 6px,#c92a50 6px 12px)}

/* zoomed card + details */
#info{position:absolute;left:0;right:0;bottom:calc(var(--ch) + 48px);z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;
  display:flex;gap:12px;align-items:flex-start;box-shadow:0 12px 34px #000c;animation:zin .2s cubic-bezier(.2,1.2,.4,1)}
#info.top{top:52px;bottom:auto}
@keyframes zin{from{transform:translateY(16px) scale(.94);opacity:0}}
#info .zc{flex:0 0 min(150px,38vw)}
#info .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
#info h3{margin:0;font:800 18px/1.2 var(--f-display)}
#info .ty{font-size:11.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#info p{margin:0;font-size:13px;line-height:1.5;white-space:pre-line}
#info .hint{color:var(--gold);font-weight:600;font-size:12.5px}
#info .hint.bad{color:#ff8fa0}
#info .btns{display:flex;gap:6px;margin-top:4px}
#info .btns button{font:800 13px var(--f-display);padding:7px 14px;border-radius:9px;border:2px solid var(--ink)}
#playBtn{background:var(--gold);color:var(--ink)}
#cancelBtn{background:transparent;color:var(--paper);border-color:var(--line)!important}

/* overlays */
.ov{position:fixed;inset:0;z-index:60;pointer-events:none}
#cutin{overflow:hidden}
.band{position:absolute;left:-12%;right:-12%;top:50%;height:40vh;transform:translateY(-50%) rotate(-7deg);overflow:hidden;
  background:linear-gradient(90deg,#140a12 0%,#4a1024 45%,var(--hot) 100%);border-block:5px solid var(--gold);
  animation:bandIn .22s ease-out both}
.band.small{height:25vh}
.band.rip{height:22vh;transform:translateY(-50%) rotate(-4deg)}
.band.rip.e{transform:translateY(-50%) rotate(4deg)}
.band.rip .txt{font-size:clamp(34px,10vw,64px)}
.band.e{background:linear-gradient(270deg,#140a12 0%,#102a4a 45%,var(--blue) 100%);transform:translateY(-50%) rotate(7deg)}
.band.out{animation:bandOut .22s ease-in forwards}
@keyframes bandIn{from{clip-path:inset(50% 0 50% 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes bandOut{to{clip-path:inset(50% 0 50% 0);opacity:.5}}
.streak{position:absolute;height:2px;background:linear-gradient(90deg,transparent,#fff9,transparent);animation:streak linear infinite}
@keyframes streak{from{transform:translateX(130vw)}to{transform:translateX(-60vw)}}
.band .who{position:absolute;left:12%;top:-6%;height:118%;aspect-ratio:1;animation:whoIn .45s cubic-bezier(.2,.9,.3,1.15) both}
.band.e .who{left:auto;right:12%;animation-name:whoInR}
.band .who svg{width:100%;height:100%;overflow:visible}
/* BARE cut-in: longer, and the camera pans slowly down the body */
.band.bare{height:48vh}
.band.bare .who{height:170%;top:-6%;left:6%;animation:whoIn .5s cubic-bezier(.2,.9,.3,1.15) both,pan 2.6s cubic-bezier(.45,0,.3,1) .5s forwards}
.band.bare.e .who{animation:whoInR .5s cubic-bezier(.2,.9,.3,1.15) both,pan 2.6s cubic-bezier(.45,0,.3,1) .5s forwards}
@keyframes pan{to{transform:translateY(-22%) scale(1.45)}}
.band .say2{position:absolute;z-index:6;right:13%;top:18%;max-width:46%;font:700 clamp(13px,3.8vw,19px)/1.3 var(--f-display);background:#fff;color:var(--ink);padding:6px 12px;border-radius:14px;border:3px solid var(--ink);animation:slam .35s .8s both;--ty:0}
.band.e .say2{right:auto;left:13%}
.say{position:absolute;left:50%;top:auto;bottom:31%;transform:translateX(-50%);z-index:9;pointer-events:none;width:max-content;max-width:150%;
  font:700 9.5cqw/1.25 var(--f-display);background:#fff;color:var(--ink);padding:2.5cqw 5cqw;border-radius:6cqw;border:1.2cqw solid var(--ink);box-shadow:0 1.5cqw 0 var(--ink)}
.say::after{content:"";position:absolute;left:50%;top:-4.5cqw;bottom:auto;transform:translateX(-50%) rotate(225deg)!important;width:5cqw;height:5cqw;background:#fff;border-right:1.2cqw solid var(--ink);border-bottom:1.2cqw solid var(--ink);transform:translateX(-50%) rotate(45deg)}
#chainpop{display:grid;place-items:center}
#chainpop b{font:italic 900 clamp(34px,11vw,64px)/1 var(--f-display);color:var(--gold);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink);animation:cpop .7s cubic-bezier(.2,1.5,.4,1) both}
#chainpop small{display:block;text-align:center;font:700 14px var(--f-display);color:#fff;-webkit-text-stroke:0;text-shadow:0 2px 4px #000}
@keyframes cpop{0%{transform:scale(2.2);opacity:0}30%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:translateY(-30px);opacity:0}}
/* ---------- meta game: map, dialogs, altar, deck ---------- */
body[data-screen="meta"] #app{visibility:hidden}
#meta{position:fixed;inset:0;z-index:50;background:radial-gradient(ellipse at 50% 100%,#5a2210 0%,#2a1018 45%,var(--bg) 80%);display:flex;flex-direction:column;
  padding:max(8px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#meta[hidden]{display:none}
.mtop{display:flex;align-items:center;gap:8px;max-width:560px;width:100%;margin:0 auto;padding-block:6px}
.mtop h2{margin:0;font:800 16px/1.2 var(--f-display);flex:1;min-width:0}
.mtop h2 small{display:block;font:600 11px var(--f-body);color:var(--muted)}
.ember{font:800 16px var(--f-display);padding:4px 10px;border-radius:99px;background:#00000055;border:1px solid #ff8a3d88;white-space:nowrap;font-variant-numeric:tabular-nums}
.mbtn{font:800 13px var(--f-display);padding:8px 12px;border-radius:10px;border:2px solid var(--ink);background:var(--panel);color:var(--paper);white-space:nowrap}
.mbtn.hot{background:var(--hot)} .mbtn.gold{background:var(--gold);color:var(--ink)} .mbtn:disabled{opacity:.45}
.mapwrap{position:relative;flex:1;width:100%;max-width:520px;margin:0 auto;min-height:0}
.mapwrap svg{position:absolute;inset:0;width:100%;height:100%}
.mapwrap .embers{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle,#ffb04a 0 1px,transparent 2px) 0 0/34px 41px,radial-gradient(circle,#ff6a2a 0 1px,transparent 2px) 13px 19px/47px 53px;opacity:.5;animation:rise 9s linear infinite}
@keyframes rise{to{background-position:0 -410px,13px -510px}}
.node{position:absolute;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;border:3px solid var(--ink);background:#3a2530;display:grid;place-items:center;font-size:24px;box-shadow:0 3px 0 var(--ink);color:var(--paper);padding:0}
.node.reach{background:#7a3a24;box-shadow:0 0 0 3px var(--gold),0 0 18px #ffc23d99;animation:pulse 1s infinite alternate}
.node.done{background:#3d4a3a}
.node.done::after{content:"✓";position:absolute;right:-4px;bottom:-4px;width:18px;height:18px;border-radius:50%;background:#7dffb0;color:var(--ink);font:800 11px/18px var(--f-display);text-align:center;border:2px solid var(--ink)}
.node.lock{opacity:.4}
.node.boss{width:64px;height:64px;font-size:30px;background:#5a1420}
.node em{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:4px;font:700 10.5px var(--f-display);white-space:nowrap;font-style:normal;text-shadow:0 1px 2px #000}
.token{position:absolute;width:30px;height:30px;transform:translate(-50%,-150%);border-radius:50% 50% 50% 0;rotate:-45deg;background:var(--gold);border:3px solid var(--ink);box-shadow:0 0 16px var(--gold);transition:left .7s cubic-bezier(.4,0,.2,1),top .7s cubic-bezier(.4,0,.2,1);pointer-events:none;z-index:3}
.npanel{max-width:520px;width:100%;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center}
.npanel .tx{flex:1;min-width:0}
.npanel b{font:800 15px var(--f-display);display:block}
.npanel small{color:var(--muted);font-size:12px;line-height:1.4;display:block}
/* dialog */

/* ================= GAME UI SKIN (pixel JRPG / card-battler look) ================= */
:root{--px:3px;--bevel-hi:#ffffff38;--bevel-lo:#00000066;--frame:#f2d37a;--frame2:#8a5a2a}
body{font-weight:500;letter-spacing:.01em}
body::after{background:
  radial-gradient(ellipse at 50% 50%,transparent 40%,#000a 100%),
  repeating-linear-gradient(0deg,#ffffff06 0 2px,transparent 2px 4px),
  radial-gradient(ellipse at 50% 50%,var(--felt),var(--bg) 70%),var(--bg)}
/* chunky pixel frame used by every panel */
.mbox,.npanel,#info,.dbox,.res,#coach .tip{border-radius:4px!important;border:var(--px) solid var(--ink)!important;
  background:linear-gradient(180deg,#3b2645,#26172d)!important;
  box-shadow:inset 0 0 0 2px var(--frame2),inset 0 0 0 4px var(--ink),inset 0 6px 0 4px #ffffff10,0 5px 0 var(--ink),0 10px 24px #000a!important}
/* bevelled game buttons */
.mbtn,.go,#endBtn,#info .btns button,.dbox .ch button,#coach .tip button,.dcell .ctl button{
  border-radius:4px!important;border:var(--px) solid var(--ink)!important;font-family:var(--f-display)!important;letter-spacing:.03em;
  box-shadow:inset 0 3px 0 var(--bevel-hi),inset 0 -4px 0 var(--bevel-lo),0 3px 0 var(--ink)!important;transition:transform .06s}
.mbtn:active,.go:active,#endBtn:active,#info .btns button:active,.dbox .ch button:active{transform:translateY(3px);box-shadow:inset 0 3px 0 var(--bevel-hi),inset 0 -2px 0 var(--bevel-lo),0 0 0 var(--ink)!important}
.mbtn.gold,.go,#playBtn{background:linear-gradient(180deg,#ffd65a,#f2a81e)!important;color:var(--ink)!important}
.mbtn.hot,#endBtn:not(:disabled){background:linear-gradient(180deg,#ff6a72,#d8283f)!important;color:#fff!important;text-shadow:0 2px 0 var(--ink)}
.go{font-size:19px!important;padding:12px!important}
.go[style*="--panel"],.go#quickBtn,.go#tutBtn,.go#retreatBtn,.go#muteBtn2{background:linear-gradient(180deg,#4a3256,#2f1d37)!important;color:var(--paper)!important}
.go#resetBtn{background:transparent!important;box-shadow:none!important;border-color:transparent!important}
/* title screen: JRPG menu */
#start .mbox{text-align:center}
#start .logo{font-size:clamp(52px,16vw,78px);letter-spacing:.02em;text-shadow:0 5px 0 var(--hot),0 9px 0 var(--ink)}
#start ol{text-align:left;background:#00000033;border:2px solid #ffffff14;padding:10px 12px 10px 30px;border-radius:4px}
#start .go{position:relative}
#start .go:hover::before,#start .go:focus-visible::before{content:"▶";position:absolute;left:14px;animation:blinkc .6s steps(2) infinite}
@keyframes blinkc{50%{opacity:0}}
/* top bars: name plates + segmented stamina gauges */
.who-l{border-radius:3px!important;border:2px solid var(--ink)!important;box-shadow:inset 0 2px 0 var(--bevel-hi),0 2px 0 var(--ink)}
.hp{flex-direction:column;align-items:flex-start;gap:2px}
.hp b{font-size:20px}
.hpbar{width:min(22vw,100px);height:12px;background:#1a0d14;border:2px solid var(--ink);box-shadow:0 0 0 1px #ffffff22;position:relative;overflow:hidden}
.hpbar i{position:absolute;inset:0;width:var(--w);background:linear-gradient(180deg,#9dff6a,#3fbf3a);transition:width .4s steps(8)}
.hpbar.mid i{background:linear-gradient(180deg,#ffe066,#e0a020)} .hpbar.low i{background:linear-gradient(180deg,#ff7a6a,#d02a2a)}
.hpbar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9px,#00000055 9px 11px)}
.hp small{display:none}
.hpnum{font:700 12px var(--f-display);color:var(--paper);display:flex;gap:6px;align-items:baseline}
#pBar,#eBar{gap:6px}
#endBtn{padding:7px 10px!important;font-size:14px!important}
#pDeck{font-size:11px}
/* AP as crystals */
.ap i{width:14px!important;height:14px!important;border-radius:2px!important;transform:rotate(45deg);border:2px solid var(--ink)!important;background:#2a1a30!important;box-shadow:none!important}
.ap i.on{background:linear-gradient(135deg,#bff7ff,#38b7ff 60%,#1a5fd0)!important;box-shadow:0 0 8px #38b7ff!important}
.ap i.bank.on{background:linear-gradient(135deg,#fff4c0,#ffc23d 60%,#c07a10)!important;box-shadow:0 0 8px #ffc23d!important}
/* chain rail as HUD */
.cc{text-shadow:0 3px 0 var(--ink)}
.chip,.ms span,#scene{border-radius:3px!important;border:2px solid var(--ink)!important;box-shadow:inset 0 2px 0 var(--bevel-hi)}
/* cards: thicker gold frame */
.hcard{border:3px solid var(--ink)!important;border-radius:6px!important;box-shadow:inset 0 0 0 2px var(--frame),0 3px 0 var(--ink),0 8px 16px #0009}
.hcard.chain{box-shadow:inset 0 0 0 2px var(--frame),0 0 0 3px var(--gold),0 0 18px #ffc23daa!important}
.slot{border-radius:6px;border-style:solid;border-color:#ffffff14;background:repeating-linear-gradient(45deg,#ffffff05 0 6px,transparent 6px 12px)}
/* dialog: JRPG text box with name tab + blinking arrow */
.dbox{position:relative;padding-top:18px!important}
.dbox h4{position:absolute;top:-14px;left:84px;margin:0;padding:3px 12px;background:linear-gradient(180deg,#ffd65a,#f2a81e);color:var(--ink)!important;border:var(--px) solid var(--ink);border-radius:3px;font-size:14px!important;box-shadow:0 3px 0 var(--ink)}
.dbox .pf{border-radius:4px!important;border:var(--px) solid var(--ink)!important;box-shadow:inset 0 0 0 2px var(--frame)}
.dbox p{font-size:15.5px!important;min-height:3.2em}
.dbox .nx{font-size:0!important}
.dbox .nx::after{content:"▼";font-size:14px;color:var(--gold);display:inline-block;animation:bob2 .6s steps(2) infinite}
@keyframes bob2{50%{transform:translateY(3px)}}
/* map nodes as pixel badges */
.node{border-radius:6px!important;border:var(--px) solid var(--ink)!important;box-shadow:inset 0 3px 0 var(--bevel-hi),inset 0 -4px 0 var(--bevel-lo),0 4px 0 var(--ink)!important}
.node.reach{box-shadow:inset 0 3px 0 var(--bevel-hi),inset 0 -4px 0 var(--bevel-lo),0 4px 0 var(--ink),0 0 0 3px var(--gold),0 0 18px #ffc23d99!important}
.node em{font-family:var(--f-body);font-weight:700}
.ember{border-radius:3px!important;border:2px solid var(--ink)!important;background:linear-gradient(180deg,#5a2a1a,#2a120e)!important;box-shadow:inset 0 2px 0 var(--bevel-hi)}
.mtop h2{text-shadow:0 2px 0 var(--ink)}
/* banners in pixel type */
#banner b,.band .txt,#chainpop b,.logo,.sfx b{font-family:var(--f-display)!important;font-style:normal!important;letter-spacing:.03em}

/* digits: the pixel face makes 2/5/8 look alike, so every number uses the clear squared face */
:root{--f-num:'Chakra Petch','Noto Sans Thai',system-ui,sans-serif}
.card .st,.card .st span,.hp b,.hpnum,.cost,.cc #cc,.ms span,.ember,.hst,.bignum,.float,.was,.hbar .lv,#eDeck,#pDeck,.ap small,.rar,.dcell .ctl span,.chip,#chainpop b,.slot::before{font-family:var(--f-num)!important;font-weight:700!important;font-variant-numeric:tabular-nums}
.card .st{font-size:12.5cqw!important}
.ms span{letter-spacing:.02em}

/* ===== title screen ===== */
#start.title{display:block;padding:0;background:radial-gradient(ellipse at 50% 30%,#6a1a3a 0%,#2a0d1c 55%,#0d070c 100%);overflow:hidden}
#start.title::before{content:"";position:absolute;inset:0;background:url('art/bg/onsen.png') center/cover;opacity:.22;image-rendering:pixelated;filter:saturate(1.3)}
#start .tline{position:absolute;left:50%;bottom:236px;transform:translateX(-50%);width:min(520px,118vw);height:min(300px,calc(100vh - 236px - 190px));pointer-events:none}
#start .tline img{position:absolute;bottom:0;height:100%;image-rendering:pixelated;filter:drop-shadow(0 6px 0 #0008);animation:tbob 3.2s ease-in-out infinite}
@keyframes tbob{50%{transform:translateY(-6px)}}
#start .tglow{position:absolute;left:0;right:0;bottom:196px;height:120px;background:radial-gradient(ellipse at 50% 60%,#ffc23d55,transparent 70%);pointer-events:none}
#start .tmenu{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,460px);box-sizing:border-box;padding:12px 16px max(16px,env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,#0d070cf2 18%);border:0!important;box-shadow:none!important}
#start .tlogo{position:absolute;top:max(18px,env(safe-area-inset-top));left:0;right:0;text-align:center;pointer-events:none}
#start .tlogo .logo{font-size:clamp(52px,16vw,84px);animation:tlogo 2.4s ease-in-out infinite}
@keyframes tlogo{50%{transform:scale(1.04) rotate(-1deg)}}
#start .tlogo small{display:inline-block;margin-top:6px;font:800 12px var(--f-display);letter-spacing:.2em;color:#ffd7e0;background:#c81f50;padding:3px 10px;border:2px solid var(--ink)}
#start .tgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
#start .tgrid .go{margin:0!important;font-size:13px!important;padding:10px 4px!important;display:flex;flex-direction:column;align-items:center;gap:2px;background:linear-gradient(180deg,#4a3256,#2f1d37)!important;color:var(--paper)!important}
#start .tgrid .go i{font-style:normal;font-size:20px}
#start .tsmall{display:flex;justify-content:space-between;margin-top:8px}
#start .tsmall .go{width:auto;font-size:12px!important;padding:6px 10px!important;background:transparent!important;box-shadow:none!important;border-color:transparent!important;color:var(--muted)!important}
#start .ttap{position:absolute;inset:0;display:grid;place-items:end center;padding-bottom:18vh;background:transparent;z-index:2;cursor:pointer}
#start .ttap b{font:800 18px var(--f-display);color:#fff;-webkit-text-stroke:1px var(--ink);paint-order:stroke fill;animation:tpulse 1.2s ease-in-out infinite}
@keyframes tpulse{50%{opacity:.35}}
#start.tapped .ttap{display:none}#start:not(.tapped) .tmenu{opacity:0;pointer-events:none}
#start .tmenu{transition:opacity .4s}
/* ===== guide (how to play) ===== */
#guide{position:fixed;inset:0;z-index:98;background:radial-gradient(ellipse at 50% 35%,#4a1630,#140a12 75%);display:flex;flex-direction:column;align-items:center;overflow:hidden}
#guide[hidden]{display:none}
#guide .gstage{flex:1;width:100%;max-width:560px;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top)) 12px 0;min-height:0;position:relative}
#guide .gstep{position:absolute;top:max(10px,env(safe-area-inset-top));right:12px;font:800 12px var(--f-display);color:var(--muted)}
#guide .gbot{position:relative;width:100%;max-width:560px;height:clamp(230px,36vh,300px)}
#guide .gport{position:absolute;left:-6px;bottom:0;height:118%;image-rendering:pixelated;filter:drop-shadow(0 4px 0 #0009);animation:tbob 3s ease-in-out infinite;pointer-events:none}
#guide .gbox{position:absolute;left:34%;right:10px;bottom:max(14px,env(safe-area-inset-bottom));background:#fff8ee;color:#2a1418;border:3px solid var(--ink);border-radius:6px;padding:10px 12px 26px;box-shadow:0 5px 0 var(--ink);min-height:110px}
#guide .gbox b{position:absolute;top:-14px;left:10px;background:#c81f50;color:#fff;font:800 13px var(--f-display);padding:2px 10px;border:2px solid var(--ink)}
#guide .gbox p{margin:6px 0 0;font-size:15px;line-height:1.55}
#guide .gbox p em{font-style:normal;color:#c81f50;font-weight:800}
#guide .gbox .gnav{position:absolute;right:8px;bottom:4px;display:flex;gap:10px;font:800 12px var(--f-display);color:#8a6a70}
#guide .gbox .gnav button{background:none;border:0;color:inherit;font:inherit;padding:2px}
#guide .gbox::after{content:"▼";position:absolute;left:12px;bottom:6px;font-size:11px;color:#c81f50;animation:tpulse 1s infinite}
.gcards{display:flex;justify-content:center;align-items:flex-end;gap:8px;max-width:100%}
.gfan{gap:0;padding:0 18px}
.gcards .hcard{width:min(30vw,130px)}
.gfan .hcard{width:min(20vw,100px);margin:0 -16px;transform:rotate(var(--r)) translateY(var(--y));box-shadow:0 8px 20px #0009}
.gbig{position:relative;width:min(42vw,190px)}
.gbig .hcard{width:100%}
.gtag{position:absolute;white-space:nowrap;background:#ffc23d;color:#2a1418;font:800 12px var(--f-display);padding:3px 7px;border:2px solid var(--ink);border-radius:4px;box-shadow:0 3px 0 var(--ink);animation:gin .4s both}
.gtag::before{content:"";position:absolute;width:14px;border-top:2px dashed #ffc23d}
.gtag.l{right:calc(100% - 22px)}.gtag.l::before{display:none}
.gtag.r{left:calc(100% - 22px)}.gtag.r::before{display:none}
@keyframes gin{from{opacity:0;transform:scale(.6)}}
.glanes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:min(92vw,420px)}
.glanes .gl{background:#ffffff10;border:2px dashed #ffffff30;border-radius:6px;height:min(20vh,130px);display:grid;place-items:center;position:relative;overflow:hidden}
.glanes .gl img{height:100%;image-rendering:pixelated}
.glanes .gl.foe img{filter:hue-rotate(-20deg) brightness(.85)}
.glanes .gl span{font:800 12px var(--f-display);color:var(--muted)}
.garrow{grid-column:span 1;text-align:center;font:900 22px var(--f-display);color:var(--gold);animation:tpulse 1s infinite}
.gstam{grid-column:1/-1;text-align:center;font:800 14px var(--f-display);background:#c81f50;color:#fff;border:2px solid var(--ink);padding:4px}
.gspr{display:flex;gap:6px;align-items:flex-end;justify-content:center}
.gspr figure{margin:0;text-align:center}
.gspr img{height:min(28vh,190px);image-rendering:pixelated;filter:drop-shadow(0 4px 0 #0008)}
.gspr figcaption{font:800 13px var(--f-display);color:var(--gold)}
.gspr figure.bare img{filter:drop-shadow(0 0 10px #ff4a5c) drop-shadow(0 4px 0 #0008)}
.gladder{display:grid;gap:8px;width:min(86vw,360px)}
.gladder div{display:flex;align-items:center;gap:10px;background:#ffffff12;border:2px solid var(--ink);padding:8px 10px;border-radius:6px;animation:gin .4s both}
.gladder b{font:900 22px var(--f-display);color:var(--gold);width:28px;text-align:center}
.gladder span{font:800 15px var(--f-display);color:#fff}
.gladder small{color:var(--muted);font-size:12px;margin-left:auto;text-align:right}
.gmap{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(90vw,380px)}
.gmap div{background:#ffffff12;border:2px solid var(--ink);border-radius:6px;padding:10px 4px;text-align:center;font-size:12px;color:var(--paper)}
.gmap i{display:block;font-style:normal;font-size:26px}
/* ===== deck builder ===== */
.dk-top{width:100%;max-width:560px;margin:0 auto;background:#0d070cd9;border:2px solid var(--ink);border-radius:8px;padding:8px;box-sizing:border-box}
.dk-slots{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.dk-slot{position:relative;aspect-ratio:3/4;border-radius:4px;border:2px solid var(--ink);background:#ffffff0c;overflow:hidden;background-repeat:no-repeat;image-rendering:pixelated;cursor:pointer}
.dk-slot.e{border:2px dashed #ffffff26;cursor:default}
.dk-slot.mv{display:grid;place-items:center;font:900 8px/1 var(--f-display);color:#fff;-webkit-text-stroke:.5px var(--ink);text-align:center;background:var(--tc)}
.dk-slot b{position:absolute;left:1px;top:1px;min-width:12px;height:12px;border-radius:50%;background:var(--gold);color:var(--ink);font:900 9px/12px var(--f-num);text-align:center;border:1px solid var(--ink)}
.dk-slot.pop{animation:dkpop .35s}
@keyframes dkpop{0%{transform:scale(1.6);filter:brightness(2)}}
.dk-stats{display:flex;align-items:flex-end;gap:10px;margin-top:8px;font:800 12px var(--f-display);color:var(--muted)}
.dk-stats .dk-n{font-size:20px;color:#fff}.dk-stats .dk-n.ok{color:var(--gold)}
.dk-stats .bad{color:#ff6a7a}
.dk-curve{margin-left:auto;display:flex;align-items:flex-end;gap:3px;height:34px}
.dk-curve div{width:14px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font:800 9px var(--f-num);color:var(--muted)}
.dk-curve i{display:block;width:100%;background:linear-gradient(#ffc23d,#ff8a3d);border:1px solid var(--ink);border-radius:2px 2px 0 0;min-height:2px}
.dk-msg{font-size:11.5px;color:#ff9aa8;margin-top:4px;min-height:1em}
.dk-fil{display:flex;gap:6px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.dk-fil .mbtn{padding:5px 10px;font-size:12px;flex:none}
.dk-col{grid-template-columns:repeat(3,1fr)!important}
@media (min-width:500px){.dk-col{grid-template-columns:repeat(4,1fr)!important}}
.dk-cell{position:relative;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.dk-cell.max .hcard{filter:saturate(.4) brightness(.6)}
.dk-cell .dk-cnt{position:absolute;right:-3px;top:-5px;background:var(--hot);color:#fff;font:900 11px var(--f-num);padding:1px 6px;border:2px solid var(--ink);border-radius:10px;z-index:2}
.dk-cell .dk-cnt.z{background:#3a2a40;color:var(--muted)}
.dk-cell.shake{animation:dksh .3s}
@keyframes dksh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.dk-cell .dk-up{display:block;width:100%;margin-top:4px;font-size:10.5px;padding:4px}
#mSave[disabled]{opacity:.45}
#settings{z-index:99}

#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:55;display:flex;justify-content:center;background:linear-gradient(180deg,#2a1622,#140a12);border-top:3px solid var(--ink);box-shadow:0 -4px 0 #ffffff10;padding-bottom:env(safe-area-inset-bottom)}
#tabbar[hidden]{display:none}
#tabbar button{flex:1;max-width:112px;background:none;border:0;color:var(--muted);font:800 11px var(--f-display);padding:6px 0 7px;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
#tabbar button i{font-style:normal;font-size:22px;line-height:1.1;filter:grayscale(.6) brightness(.8);transition:transform .15s}
#tabbar button.on{color:var(--gold)}
#tabbar button.on i{filter:none;transform:translateY(-3px) scale(1.15)}
#tabbar button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--gold);border-radius:0 0 3px 3px}
#tabbar.lock{opacity:.5;pointer-events:none}
body.tabs #meta{padding-bottom:calc(58px + env(safe-area-inset-bottom))}
body.tabs #meta #mBack{display:none}

.ser-tabs{display:flex;gap:6px;overflow-x:auto;width:100%;max-width:560px;margin:0 auto;padding:4px 2px 8px;scrollbar-width:none}
.ser-tab{flex:none;width:78px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;border:2px solid var(--ink);border-radius:6px;background:linear-gradient(180deg,var(--c2),#140a12);color:var(--muted);font:800 10px/1.2 var(--f-display);opacity:.7}
.ser-tab img{height:44px;image-rendering:pixelated;object-fit:cover;object-position:top;width:44px}
.ser-tab.lock img{filter:brightness(0) opacity(.6)}.ser-tab.lock{opacity:.55}.ser-tab.shake{animation:dksh .3s}
.ser-tab.on{opacity:1;color:#fff;box-shadow:0 0 0 2px var(--c1),0 0 14px var(--c1)}
.pack.ser{position:relative;width:min(56vw,220px);aspect-ratio:3/4;border-radius:10px;overflow:hidden;border:3px solid var(--ink);box-shadow:0 0 0 3px var(--c1),0 10px 30px #000c,0 0 34px var(--c1);background:none;display:block}
.pack.ser .pk-bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,var(--c1),var(--c2) 70%),repeating-conic-gradient(from 0deg,#ffffff22 0 10deg,transparent 10deg 20deg);background-blend-mode:screen}
.pack.ser .pk-hero{position:absolute;left:50%;bottom:-6%;height:96%;transform:translateX(-50%);image-rendering:pixelated;filter:drop-shadow(0 0 8px #000a)}
.pack.ser .pk-name{position:absolute;left:0;right:0;top:8px;text-align:center;font:900 17px/1.1 var(--f-display);color:#fff;-webkit-text-stroke:1px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink)}
.pack.ser .pk-name small{display:block;font-size:10px;letter-spacing:.3em;color:var(--c1)}
.pack.ser .pk-ur{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,#000d,transparent);padding:14px 6px 6px;text-align:center;font:800 12px var(--f-display);color:#fff}
.pack.ser .pk-ur b{display:inline-block;margin-right:6px;padding:1px 6px;border:2px solid var(--ink);background:linear-gradient(90deg,#ff6ad5,#ffd36a,#6affd8,#6aa8ff);color:var(--ink);animation:urglow 2s linear infinite;background-size:200% 100%}
@keyframes urglow{to{background-position:200% 0}}
.pk-sub{margin:0;font:700 13px var(--f-display);color:var(--paper)}
.rar.UR{background:linear-gradient(90deg,#ff6ad5,#ffd36a,#6affd8,#6aa8ff,#ff6ad5);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:urglow 2s linear infinite}
.pull .front.UR .hcard{box-shadow:0 0 0 3px #fff,0 0 30px #ff6ad5,0 0 50px #6affd8}

/* whole-body cut-in bounce + zoom windows */
.wb img{width:100%;height:100%;image-rendering:pixelated;transform-origin:50% 100%;animation:wbody 1.7s cubic-bezier(.3,.7,.4,1) .45s both;will-change:transform}
.r1.wb img{animation-delay:.6s}
@keyframes wbody{0%{transform:none}9%{transform:scale(1.07,.9)}20%{transform:scale(.95,1.07) translateY(-3%)}32%{transform:scale(1.04,.96)}45%{transform:scale(.985,1.02)}60%,100%{transform:none}}
.zooms{position:absolute;top:7%;bottom:7%;right:13%;display:flex;flex-direction:column;justify-content:center;gap:3%;z-index:4;pointer-events:none}
.band.e .zooms{right:auto;left:13%}

}

const store = {
  get(k) { try { return localStorage.getItem('bd_' + k); } catch (_) { return null; } },
  set(k, v) { try { localStorage.setItem('bd_' + k, v); } catch (_) {} },
};
let tutorialOff = store.get('tutOff') === '1';
const seenTips = new Set();
function coach(target, title, text, step) {
  return new Promise(res => {
    const box = $('#coach'), hole = box.querySelector('.hole'), tipEl = box.querySelector('.tip');
    box.hidden = false;
    tipEl.querySelector('h4').textContent = title;
    tipEl.querySelector('p').innerHTML = text;
    tipEl.querySelector('small').textContent = step || '';
    const el = typeof target === 'string' ? $(target) : target;
    const r = el ? el.getBoundingClientRect() : { left: innerWidth / 2, top: innerHeight / 2, width: 0, height: 0 };
    const pad = 6;
    Object.assign(hole.style, { left: r.left - pad + 'px', top: r.top - pad + 'px', width: r.width + pad * 2 + 'px', height: r.height + pad * 2 + 'px' });
    const below = r.top + r.height / 2 < innerHeight / 2;
    Object.assign(tipEl.style, below ? { top: Math.min(innerHeight - 200, r.top + r.height + 16) + 'px', bottom: 'auto' } : { bottom: Math.max(16, innerHeight - r.top + 16) + 'px', top: 'auto' });
    const done = skip => { box.hidden = true; if (skip) { tutorialOff = true; store.set('tutOff', '1'); } res(); };
    $('#coachNext').onclick = e => { e.stopPropagation(); done(false); };
    $('#coachSkip').onclick = e => { e.stopPropagation(); done(true); };
  });
}

/* ---------- screens ---------- */
function fadeIn(ms = 420) { if (window.FAST || LOWMO) return; let f = $('#fader'); if (!f) { f = document.createElement('div'); f.id = 'fader'; document.body.appendChild(f); }
  f.getAnimations().forEach(a => a.cancel()); f.animate([{ opacity: 1 }, { opacity: 0 }], { duration: ms / SPD, easing: 'ease-out', fill: 'forwards' }); }

/* ---------- bottom tab bar: one-thumb navigation between the hub screens (portrait phones) ---------- */
let tabLeave = null;   // a screen can veto/handle leaving (deck builder with unsaved changes)
function setTab(k) {
  let t = $('#tabbar');
  if (!t) {
    t = document.createElement('nav'); t.id = 'tabbar';
    t.innerHTML = [['map', '🗺️', 'แผนที่'], ['deck', '🃏', 'เด็ค'], ['altar', '🔥', 'เปิดซอง'], ['book', '📖', 'สะสม'], ['menu', '☰', 'เมนู']]
      .map(([k, i, n]) => `<button id="tb${k[0].toUpperCase() + k.slice(1)}" data-tab="${k}"><i>${i}</i>${n}</button>`).join('');
    document.body.appendChild(t);
    t.onclick = e => { const b = e.target.closest('[data-tab]'); if (!b || t.classList.contains('lock')) return; const k = b.dataset.tab;
      if (k === t.dataset.on && k !== 'menu') return;
      if (tabLeave && tabLeave(k) === false) return; tabLeave = null; SFX.play('click');
      if (k === 'map') renderMap(); else if (k === 'deck') renderDeck(); else if (k === 'altar') renderAltar(); else if (k === 'book') renderBook();
      else { setTitleButtons(); $('#start').classList.add('tapped'); $('#start').hidden = false; } };
  }
  t.hidden = !k; t.dataset.on = k || ''; t.classList.remove('lock'); document.body.classList.toggle('tabs', !!k);
  t.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === k));

function rollDeck(base, fl) {
  // keep the move cards, reshuffle which wardens show up (the floor's pool, one wildcard from higher floors)
  const W = ['wchain', 'wneedle', 'wchub', 'wsumo', 'wbutler', 'wgorilla'], d = { ...base };
  const nW = Object.entries(d).filter(([id]) => W.includes(id)).reduce((t, [, c]) => t + c, 0);
  for (const id of W) delete d[id];
  const pool = W.slice(0, Math.min(W.length, 3 + fl));
  for (let i = 0; i < nW; i++) { const id = pick(pool); d[id] = (d[id] || 0) + 1; }
  return d;
}

    if (pal) { let best = 0, bd = 1e9; for (let k = 0; k < pal.length; k++) { const p = pal[k], dd = (d[i] - p[0]) ** 2 * 2 + (d[i + 1] - p[1]) ** 2 * 3 + (d[i + 2] - p[2]) ** 2; if (dd < bd) { bd = dd; best = k; } } [d[i], d[i + 1], d[i + 2]] = pal[best]; }
    else { const q = 256 / o.levels; for (let k = 0; k < 3; k++) d[i + k] = Math.min(255, Math.floor(d[i + k] / q) * q + q / 2); }
    if (E) { const p0 = i / 4, X = p0 % W, Y = (p0 / W) | 0, s = .75;
      for (let j = 0; j < 3; j++) { const e = (o0[j] - d[i + j]) * s;
        if (X + 1 < W) E[(p0 + 1) * 3 + j] += e * 7 / 16;
        if (Y + 1 < H) { if (X > 0) E[(p0 + W - 1) * 3 + j] += e * 3 / 16; E[(p0 + W) * 3 + j] += e * 5 / 16; if (X + 1 < W) E[(p0 + W + 1) * 3 + j] += e / 16; } } }
  }
  if (o.outline) { const out = new Uint8ClampedArray(d);
    for (let Y = 0; Y < H; Y++) for (let X = 0; X < W; X++) { const i = at(X, Y); if (d[i + 3]) continue;
      if ([[1, 0], [-1, 0], [0, 1], [0, -1]].some(([a, b]) => { const XX = X + a, YY = Y + b; return XX >= 0 && YY >= 0 && XX < W && YY < H && d[at(XX, YY) + 3]; })) { out[i] = 26; out[i + 1] = 15; out[i + 2] = 20; out[i + 3] = 255; } }
    d.set(out); }
  x.putImageData(id, 0, 0); return c.toDataURL('image/png');
}

    $('#sTut').onclick = () => { tutorialOff = !tutorialOff; store.set('tutOff', tutorialOff ? '1' : '0'); if (!tutorialOff) seenTips.clear(); draw(); };

function loveCam(src) {
  const [fx, fy, hx, hy] = LOVE_CAM[(src.split('/').pop() || '').replace('.png', '')] || [50, 25, 50, 75];
  const keys = [[fx, fy, 2.2], [fx + (hx - fx) * .45, fy + (hy - fy) * .45, 1.85], [hx, hy, 1.65], [50, 50, 1]];
  return t => { t = Math.max(0, Math.min(3, t)); const k = Math.min(2, Math.floor(t)), f = t - k, A = keys[k], B = keys[k + 1];
    return [A[0] + (B[0] - A[0]) * f, A[1] + (B[1] - A[1]) * f, A[2] + (B[2] - A[2]) * f]; };
}
function camTf([x, y, z]) { const h = 50 / z; x = Math.max(h, Math.min(100 - h, x)); y = Math.max(h, Math.min(100 - h, y));
  return `translate(${(50 - x) * z}%, ${(50 - y) * z}%) scale(${z})`; }
// a line that names a body part steers the camera there
function camKw(ln) { if (/หน้าอก|แผงอก|อ้อมอก|หัวนม|ไหล่|แขน|กอด/.test(ln)) return 1; if (/เป้า|ก้น|สะโพก|กางเกง|ตัก|เอว|พุง|ต้นขา/.test(ln)) return 2; if (/หน้า|ปาก|ดวงตา|สายตา|ยิ้ม|จูบ|แก้ม|เครา|หนวด/.test(ln)) return 0; return null; }
async function playLove(id) {
  const L = LOVE[id]; if (!L) return;
  let ov = $('#love'); if (!ov) { ov = document.createElement('div'); ov.id = 'love'; ov.className = 'ov'; document.body.appendChild(ov); }
  const tap = () => new Promise(r => { ov.onclick = () => { SFX.play('click'); r(); }; });
  const show = async (src, lines) => {
    const url = await cgSrc(src);
    ov.innerHTML = `<div class="lv-cg"><img src="${url}" alt=""></div><div class="lv-txt"><b>${nameOf(id)}</b><p></p><small>แตะเพื่อไปต่อ ▸</small></div>`;
    ov.hidden = false; ov.classList.remove('dark'); await sleep(50);
    const img = ov.querySelector('.lv-cg img'), cam = loveCam(src), n = lines.length;
    let at = 0; img.style.transform = camTf(cam(0));
    for (let i = 0; i < n; i++) {
      const ln = lines[i]; ov.querySelector('.lv-txt p').textContent = ln;
      let to = (i + 1) * 3 / n; const kw = i < n - 1 && camKw(ln); if (kw != null && kw >= at) to = kw;
      const a = img.animate([{ transform: camTf(cam(at)) }, { transform: camTf(cam(to)) }], { duration: LOWMO ? 300 : 2600 / Math.max(SPD, .5), easing: 'ease-in-out', fill: 'forwards' });
      at = to; await tap(); a.finish();
    }
  };
  SFX.play('whoosh');
  await show(L.cg[0], L.a);
  if (L.mid) { ov.classList.add('dark'); await sleep(600); await show(L.mid, L.m || ['…']); }
  ov.classList.add('dark'); ov.querySelector('.lv-txt').style.visibility = 'hidden'; await sleep(1400);
  await show(L.cg[1], L.b);
  ov.classList.add('dark'); await sleep(700); ov.hidden = true; ov.innerHTML = ''; ov.onclick = null;
  (SV.loveSeen ||= {})[id] = true; persist();
}

  const ids = Object.keys(ART).filter(k => !k.endsWith('_f') && DEF(k) && DEF(k).type === 'hunk');
  id = id || ids[0];
  let reg = ART[id].butt ? 'butt' : 'crotch', stage = 2, cc = null;
  let ov = $('#tuner'); if (!ov) { ov = document.createElement('div'); ov.id = 'tuner'; ov.className = 'ov'; document.body.appendChild(ov); }
  const T = () => (TUNE[id] ||= {});
  const NM = { pec: 'อก', belly: 'พุง', crotch: 'เป้า', butt: 'ก้น', head: 'หัว' };
  const sl = (lab, k, mn, mx, v, st = 1) => `<label class="tsl"><span>${lab} <b>${(+v).toFixed(st < 1 ? 2 : 0)}</b></span><input type="range" data-k="${k}" min="${mn}" max="${mx}" step="${st}" value="${v}"></label>`;
  const draw = () => {
    const a = ART[id]; if (!a[reg]) a[reg] = [Math.round(a.w / 2), Math.round(a.h / 2), 12, 8];
    const [cx, cy, rx, ry] = a[reg], t = T(), val = (o, d) => t[o]?.[reg] ?? d;
    if (cc) CUTS.delete(cc);
    ov.innerHTML = `<div class="tpanel"><div class="thead"><div class="trow"><select id="tId">${ids.map(k => `<option value="${k}" ${k === id ? 'selected' : ''}>${DEF(k).name}</option>`).join('')}</select>
      <select id="tSt">${[[2, 'ชุดเต็ม'], [1, 'แตก 1 ชั้น'], [0, 'BARE']].map(([v, n]) => `<option value="${v}" ${v === stage ? 'selected' : ''}>${n}</option>`).join('')}</select><button class="mbtn" id="tX">ปิด</button></div>
      <div class="tview"><div class="spw tsp" style="aspect-ratio:${a.w}/${a.h}">${spriteLayer(DEF(id), stage)}</div>
        <div class="tring" style="left:${cx / a.w * 100}%;top:${cy / a.h * 100}%;width:${rx * 2 / a.w * 100}%;height:${ry * 2 / a.h * 100}%"></div><div class="tring tfo"></div></div>
      <div class="trow">${Object.keys(NM).map(k => `<button class="mbtn ${k === reg ? 'gold' : ''}" data-r="${k}">${NM[k]}</button>`).join('')}</div><small class="thint">แตะ/ลากบนภาพเพื่อย้ายจุด</small></div>
      ${sl('ตำแหน่ง X', 'x', 0, a.w, cx)}${sl('ตำแหน่ง Y', 'y', 0, a.h, cy)}${sl('กว้าง', 'w', 2, 45, rx)}${sl('สูง', 'h', 2, 45, ry)}
      ${sl('ขอบนุ่ม (ขยายออกนอกวง) %', 'fo', 0, 200, val('fo', 40), 5)}${sl('แรงเด้ง', 'amp', 0, 3, val('amp', 1), .1)}${sl('ขนาด', 'size', .6, 1.6, val('size', 1), .05)}

    ov.hidden = false;

      Object.assign(ov.querySelector('.tring').style, { left: pc(x, a.w), top: pc(y, a.h), width: pc(w * 2, a.w), height: pc(h * 2, a.h) });
      Object.assign(ov.querySelector('.tfo').style, { left: pc(x, a.w), top: pc(y, a.h), width: pc(w * 2 * (1 + F), a.w), height: pc(h * 2 * (1 + F), a.h) }); };
    updRings();
    const el = ov.querySelector('.tsp'), q = k => [...el.querySelectorAll(`[data-b="${k}"]`)];

      sp: { p: { x: 0, v: 0 }, b: { x: 0, v: 0 }, h: { x: 0, v: 0 }, f: { x: 0, v: 0 } }, fw: { [reg]: 1.3 } };
    CUTS.add(cc);
    $('#tId').onchange = e => { id = e.target.value; reg = ART[id].butt ? 'butt' : 'crotch'; draw(); };
    $('#tSt').onchange = e => { stage = +e.target.value; draw(); };
    ov.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { reg = b.dataset.r; draw(); });
    ov.querySelectorAll('input[type=range]').forEach(r => {
      r.oninput = () => { const k = r.dataset.k, v = +r.value, t = T(); r.previousElementSibling.querySelector('b').textContent = v.toFixed(+r.step < 1 ? 2 : 0);
        if ('xywh'.includes(k)) { a[reg]['xywh'.indexOf(k)] = v; (t.reg ||= {})[reg] = [...a[reg]]; }
        else if (k === 'bn') t.bn = v; else (t[k] ||= {})[reg] = v;

      a[reg][0] = Math.round(clamp((e.clientX - r.left) / r.width, 0, 1) * a.w); a[reg][1] = Math.round(clamp((e.clientY - r.top) / r.height, 0, 1) * a.h);

    let dragging = false;
    tv.onpointerdown = e => { dragging = true; tv.setPointerCapture(e.pointerId); move(e); };
    tv.onpointermove = e => { if (dragging) move(e); };
    tv.onpointerup = () => { if (dragging) { dragging = false; draw(); kick(); } };
    $('#tRs').onclick = () => { delete TUNE[id]; saveTune(); for (const k of Object.keys(NM)) { if (ART0[id]?.[k]) ART[id][k] = [...ART0[id][k]]; else delete ART[id][k]; } reg = ART[id].butt ? 'butt' : 'crotch'; draw(); };
    $('#tCp').onclick = () => { const txt = JSON.stringify(TUNE); try { navigator.clipboard.writeText(txt); } catch (e) {}
      let box = ov.querySelector('.tout'); if (!box) { box = document.createElement('textarea'); box.className = 'tout'; box.readOnly = true; ov.querySelector('.tpanel').appendChild(box); }
      box.value = txt; box.focus(); box.select(); $('#tCp').textContent = 'คัดลอกแล้ว ✓ วางส่งในแชทได้เลย'; };
    $('#tX').onclick = () => { CUTS.delete(cc); ov.hidden = true; ov.innerHTML = ''; for (const c of CARDS.values()) { c.sig = ''; updateCard(c); } };
  };
  draw();
}

/* ---------- map layout reshuffle on replays (after the floor boss is cleared) ---------- */
function shuffleFloor(F) {
  const mid = F.nodes.filter(x => !['start', 'boss'].includes(x.t)), types = mid.map(x => x.t);
  for (let i = types.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [types[i], types[j]] = [types[j], types[i]]; }
  mid.forEach((x, i) => x.t = types[i]); (SV.layout ||= {})[F.n] = Object.fromEntries(mid.map(x => [x.id, x.t]));
}
function applyLayouts() { for (const F of FLOORS) { const L = SV?.layout?.[F.n]; if (L) for (const x of F.nodes) if (L[x.id]) x.t = L[x.id]; } }

/* ---------- pixel particle FX: heal fireflies, fire sparks, water splash, power sparkle, steam ---------- */
function pfx(target, kind, n = 14) {
  if (window.FAST || RM || LOWMO) return;
  const el = target?.uid ? CARDS.get(target.uid)?.el : target; if (!el) return;
  const P = { heal: ['#b8ff8a', '#fff59a', '#8affc8'], fire: ['#ffdd55', '#ff8a2a', '#ff3b2a'], water: ['#bfe8ff', '#5ab8ff', '#ffffff'], power: ['#ffe066', '#fff', '#ffb02a'], steam: ['#ffffffcc', '#e8e8f0aa'], shirt: ['#9fe0ff', '#fff'] }[kind] || ['#fff'];
  for (let i = 0; i < n; i++) {
    const d = document.createElement('i'); d.className = 'px'; const sz = kind === 'steam' ? rnd(8, 14) : rnd(3.5, 7);
    d.style.cssText = `left:${rnd(15, 85)}%;top:${kind === 'heal' || kind === 'steam' ? rnd(55, 95) : rnd(30, 75)}%;width:${sz}cqw;height:${sz}cqw;background:${pick(P)};${kind === 'heal' || kind === 'power' ? `box-shadow:0 0 3cqw ${P[0]}` : ''}`;
    el.appendChild(d);
    const dx = rnd(-30, 30), up = kind === 'water' ? rnd(-20, 30) : -rnd(30, 90), dur = (kind === 'heal' ? rnd(1100, 1800) : kind === 'steam' ? rnd(1200, 1700) : rnd(500, 900)) / SPD;
    const frames = kind === 'water'
      ? [{ transform: 'translate(0,0)', opacity: 1 }, { transform: `translate(${dx}px,${-rnd(15, 35)}px)`, opacity: 1, offset: .35 }, { transform: `translate(${dx * 1.4}px,${rnd(20, 45)}px)`, opacity: 0 }]
      : kind === 'heal' ? [{ transform: 'translate(0,0) scale(.4)', opacity: 0 }, { transform: `translate(${dx * .4}px,${up * .4}px) scale(1)`, opacity: 1, offset: .3 }, { transform: `translate(${dx}px,${up}px) scale(.6)`, opacity: 0 }]
      : [{ transform: 'translate(0,0)', opacity: 1 }, { transform: `translate(${dx}px,${up}px) scale(.3)`, opacity: 0 }];
    d.animate(frames, { duration: dur, delay: rnd(0, 250), easing: kind === 'fire' ? 'ease-out' : 'ease-in-out', fill: 'both' }).onfinish = () => d.remove();
  }
}

    return `<div class="zp zs${i % 3}" style="animation-delay:${.55 + i * .22}s"><div class="zf"><div class="zg"><i style="background-image:url('${src}');background-size:${(W / Z * 100).toFixed(1)}% ${(H / Z * 100).toFixed(1)}%;background-position:${px.toFixed(1)}% ${py.toFixed(1)}%;animation-delay:${.75 + i * .22}s"></i><u></u></div></div><b>${n}</b><em class="zfx" style="animation-delay:${.85 + i * .22}s">${fx}</em>${say ? `<span class="zsay" style="animation-delay:${1.05 + i * .22}s">${say}</span>` : ''}</div>`; }).join('')}</div>`;
}
async function cutin(h, text, size, sub, quote) {
  if (h && (size === 'bare' || size === 'rip') && !cutAllowed(h, size === 'bare' ? 'bare' : h.outfit)) return;
  SFX.play('whoosh');
  const ov = $('#cutin');
  const enemy = h ? h.side === 1 : G.side === 1;
  const vb = size === 'bare' ? '0 -26 100 150' : '12 -26 76 76';
  const who = !h ? '' : ART[h.def.id]
    ? (CUT_REGION ? `<div class="who spw" style="aspect-ratio:${ART[h.def.id].w}/${ART[h.def.id].h}">${spriteLayer(h.def, h.outfit)}</div>`
      : `<div class="who wb" style="aspect-ratio:${ART[h.def.id].w}/${ART[h.def.id].h}"><img src="${spriteSrc(ART[h.def.id], h.outfit)}" alt=""></div>`)
    : `<div class="who">${hunkSVG(h.def, h.outfit, 'bare', { vb, frame: false, clip: false, bg: false })}</div>`;
  if (h && ART[h.def.id]) { const im = new Image(); im.src = spriteSrc(ART[h.def.id], h.outfit); await Promise.race([im.decode().catch(() => {}), sleep(250)]); }   // decode before the band slams in
  let streaks = ''; for (let i = 0; i < (LOWMO ? 8 : 18); i++) streaks += `<i class="streak" style="top:${rnd(0, 100)}%;width:${rnd(20, 60)}vw;animation-duration:${rnd(.25, .6)}s;animation-delay:-${rnd(0, .6)}s"></i>`;
  const steam = size === 'bare' && STEAM ? `<div class="steam">${'<i></i>'.repeat(7)}</div>` : '';
  ov.innerHTML = `<div class="band ${size} ${enemy ? 'e' : ''}">${streaks}${who}${steam}${!CUT_REGION && h && ART[h.def.id] && size === 'bare' ? zoomPanels(h.def.id, h.outfit) : ''}<div class="txt">${text}</div>${sub ? `<div class="sub">${sub}</div>` : ''}${quote ? `<div class="say2">“${quote}”</div>` : ''}</div>`;
  ov.hidden = false;
  const band = ov.firstElementChild;
  // the cut-in sprite uses the same spring body as the board: whole body bounces, soft parts ride on top
  const spw = band.querySelector('.spw'); let cc = null, pulse = null;
  if (spw && h && !RM) {
    const q = k => [...spw.querySelectorAll(`[data-b="${k}"]`)];
    cc = { el: spw, html: true, nodes: { pec: q('pec'), belly: q('belly'), head: q('head'), breath: q('breath'), crotch: q('crotch'), butt: q('butt') },
      sp: { p: { x: 0, v: 0 }, b: { x: 0, v: 0 }, h: { x: 0, v: 0 }, f: { x: 0, v: 0 } }, soft: softOf(h.def.id), ph: 0, tid: h.def.id,
      fw: ART[h.def.id]?.butt ? { butt: 1.2, pec: .6 } : { crotch: size === 'bare' ? 1.1 : .5, pec: 1, belly: .5 * softOf(h.def.id), butt: 1 } };
    CUTS.add(cc);
    const kick = m => { cc.rest = false; cc.sp.p.v += m; cc.sp.b.v += m * .9; cc.sp.h.v += m * .5; cc.sp.f.v += m * 1.3; };
    setTimeout(() => kick(LOWMO ? 14 : 38), 380); pulse = setTimeout(() => kick(LOWMO ? 4 : 10), 1700);
  }
  await sleep(size === 'bare' ? 3200 : size === 'big' ? 1500 : size === 'rip' ? 750 : 1000);
  if (cc) { clearTimeout(pulse); CUTS.delete(cc); }
  band.classList.add('out');
  await sleep(220);
  ov.hidden = true; ov.innerHTML = '';
}
async function reveal(d, side) {
  const ov = $('#reveal');
  ov.innerHTML = `<div class="rc"><em>${side === 0 ? 'คุณใช้' : 'คู่แข่งใช้'}</em><div class="hcard static" style="pointer-events:none">${cardFace(d)}</div></div>`;
  ov.hidden = false;
  await sleep(side === 0 ? 550 : 950);
  ov.hidden = true; ov.innerHTML = '';
}
async function banner(t) {
  const ov = $('#banner'); ov.innerHTML = `<b>${t}</b>`; ov.hidden = false;
  await sleep(1000); ov.hidden = true;
}

/* ---------- spring physics: the "bouncy" layer ---------- */
let lastT = performance.now();
const CUTS = new Set();
function loop(t) {
  const dt = Math.min(.033, (t - lastT) / 1000); lastT = t; const ts = t / 1000;
  const step = (s, k, d) => { s.v += (-k * s.x - d * s.v) * dt; s.x += s.v * dt; };
  for (const c of [...CARDS.values(), ...CUTS]) {
    const dm = 3 / (TUNE[c.tid]?.bn ?? 3);
    step(c.sp.p, 260, 9 * dm); step(c.sp.b, 180, 8 * dm); step(c.sp.h, 140, 9 * dm); step(c.sp.f, 190, 7.5 * dm);
    const br = RM ? 0 : Math.sin(ts * 2.1 + c.ph) * .012;
    const px = clamp(c.sp.p.x, -1.6, 1.6), bx = clamp(c.sp.b.x, -1.6, 1.6), hx = clamp(c.sp.h.x, -1.5, 1.5);
    const pT = `translate(0 ${(px * 2.2).toFixed(2)}) translate(50 30) scale(${(1 + br * 1.2 - px * .035).toFixed(4)} ${(1 + br * 1.6 + px * .07).toFixed(4)}) translate(-50 -30)`;
    const bT = `translate(50 56) scale(${(1 + bx * .06 + br * .5).toFixed(4)} ${(1 - bx * .05 + br).toFixed(4)}) translate(-50 -56)`;
    const hT = `translate(0 ${(hx * 1.8 - br * 30).toFixed(2)}) rotate(${(hx * 3).toFixed(2)} 50 8)`;
    const rT = `translate(50 72) scale(1 ${(1 + br).toFixed(4)}) translate(-50 -72)`;
    if (c.html) {
      // At rest: drop all transforms once and skip DOM writes, so the masked patch layers stop re-rasterising
      // every frame (that constant repaint is what shimmered/flickered on phones). Bounce only after a hit.
      const e = Math.abs(c.sp.f.x) + Math.abs(c.sp.f.v) + Math.abs(c.sp.p.x) + Math.abs(c.sp.p.v) + Math.abs(c.sp.b.x) + Math.abs(c.sp.b.v) + Math.abs(c.sp.h.x) + Math.abs(c.sp.h.v);
      if (e < .02 || LOWMO) {
        if (!c.rest) { c.rest = true; c.sp.p.x = c.sp.p.v = c.sp.b.x = c.sp.b.v = c.sp.h.x = c.sp.h.v = c.sp.f.x = c.sp.f.v = 0; c.focus = null;
          for (const k in c.nodes) { const s0 = TUNE[c.tid]?.size?.[k] ?? 1; for (const n of c.nodes[k] || []) n.style.transform = s0 !== 1 ? `scale(${s0})` : ''; } }
        continue;
      }
      c.rest = false;
      const br = 0;
      // Whole body moves first (squash & stretch from the feet), soft parts ride on top with a smaller extra wobble,
      // and the part that was just exposed (c.focus) gets its own stronger spring.
      const fx = clamp(c.sp.f.x, -1.8, 1.8);
      const add = k => fx * (c.fw ? (c.fw[k] || 0) : (c.focus === k ? 1 : 0));
      // whole body: small and soft; the important parts (focus) carry the big wobble
      const R = `translateY(${(px * .6).toFixed(2)}%) scale(${(1 - px * .012 + bx * .006).toFixed(4)},${(1 + px * .02).toFixed(4)}) skewX(${(hx * .5).toFixed(2)}deg)`;
      const soft = (k, ax, ay, ty) => { const A = TUNE[c.tid]?.amp?.[k] ?? 1, S = TUNE[c.tid]?.size?.[k] ?? 1, f = add(k) * A; ax *= A; ay *= A; ty *= A; return `translateY(${((ty + f * 1.5)).toFixed(2)}%) scale(${(S * (1 + ax + f * .11)).toFixed(4)},${(S * (1 + ay - f * .09)).toFixed(4)})`; };
      const P = soft('pec', -px * .015, px * .03, px * .5);
      const sb = c.soft ?? .8;
      const Bt = soft('belly', bx * .03 * sb, -bx * .025 * sb, bx * .3 * sb);
      const Cr = soft('crotch', bx * .03, -bx * .025, bx * .4);
      const Bu = soft('butt', px * .025, -px * .03, px * .5);
      const Ht = `translateY(${(hx * .3).toFixed(2)}%) rotate(${(hx * 1).toFixed(2)}deg)`;
      for (const n of c.nodes.breath) n.style.transform = R;
      for (const n of c.nodes.pec) n.style.transform = P;
      for (const n of c.nodes.belly) n.style.transform = Bt;
      for (const n of c.nodes.head) n.style.transform = Ht;
      for (const n of c.nodes.crotch) n.style.transform = Cr;
      for (const n of c.nodes.butt) n.style.transform = Bu;
      continue;
    }
    c.nodes.pec?.forEach(n => n.setAttribute('transform', pT));
    c.nodes.belly?.forEach(n => n.setAttribute('transform', bT));
    c.nodes.head?.forEach(n => n.setAttribute('transform', hT));
    c.nodes.breath?.forEach(n => n.setAttribute('transform', rT));
  }
  requestAnimationFrame(loop);
}
buildRows();
setTitleButtons();
$('#muteBtn2').onclick = e => { e.stopPropagation(); SFX.toggle(); syncMute(); };
syncMute();
requestAnimationFrame(loop);
</script>
